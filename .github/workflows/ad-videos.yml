# Render the three launch ads to MP4 and publish them as a GitHub Release.
#
# This runs in CI rather than in an agent sandbox for one concrete reason: the
# sandbox's proxy denies both speech.platform.bing.com (so there is no
# voiceover) and the Supabase storage host (so the medical plates and the notes
# screens cannot load). A runner has open network, so it can capture clean
# screens, download the real plates, synthesise the voice, and render.
#
# Each ad is a complete, standalone 90-second spot. They render as three
# parallel jobs because they are three separate videos, never chapters of one.

name: Ad videos

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag for the MP4s (e.g. ads-1)'
        required: true
        default: 'ads-1'

permissions:
  contents: write

jobs:
  assets:
    name: Capture screens, plates and voiceovers
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the app's deps (for the screenshot harness)
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Install the renderer's deps
        working-directory: remotion-ad
        run: npm install --legacy-peer-deps

      - name: Install Chromium for the screenshot harness
        working-directory: mobile
        run: npx playwright-core install chromium --with-deps

      - name: Capture the real app screens
        working-directory: remotion-ad
        run: npm run screens

      - name: Download the real medical plates
        working-directory: remotion-ad
        run: npm run plates

      - name: Install edge-tts
        run: pip install edge-tts

      # `npm run voice` writes the manifest AND runs the synthesiser. It used to
      # only write the manifest, which meant CI never re-recorded anything and
      # the committed clips could drift away from the script -- orbit-2am had
      # done exactly that, and would have shipped an ad whose voice contradicted
      # its own captions.
      #
      # If Microsoft's endpoint is unreachable this step fails and no ad is
      # published. That is the intended trade: an ad with no voice is not an ad.
      - name: Synthesise the voiceovers
        working-directory: remotion-ad
        run: npm run voice

      # Nothing renders until every asset a script names is present and is not
      # a blank capture. This is the guard against shipping a cut with "this
      # diagram could not be loaded" in it, which has happened before -- and now
      # also against a silent shot, which is worse because it looks finished.
      - name: Preflight
        working-directory: remotion-ad
        run: npm run preflight

      - name: Share the assets with the render jobs
        uses: actions/upload-artifact@v4
        with:
          name: ad-assets
          path: |
            remotion-ad/public/app_screens
            remotion-ad/public/audio
          retention-days: 1

  render:
    name: Render ${{ matrix.ad }}
    needs: assets
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - ad: orbit-the-pattern
            file: orbit-the-pattern.mp4
          - ad: orbit-2am
            file: orbit-2am.mp4
          - ad: orbit-draw-it-from-memory
            file: orbit-draw-it-from-memory.mp4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the renderer's deps
        working-directory: remotion-ad
        run: npm install --legacy-peer-deps

      - name: Pull the assets
        uses: actions/download-artifact@v4
        with:
          name: ad-assets
          path: remotion-ad/public

      - name: Preflight
        working-directory: remotion-ad
        run: npm run preflight

      - name: Render
        working-directory: remotion-ad
        run: |
          npx remotion render "${{ matrix.ad }}" "out/${{ matrix.file }}" \
            --concurrency=2 --log=info

      - name: Check the file is a real video, not an empty container
        working-directory: remotion-ad
        run: |
          SIZE=$(stat -c%s "out/${{ matrix.file }}")
          echo "${{ matrix.file }} is $SIZE bytes"
          # 90 seconds of 1080x1920 at CRF 18 is several megabytes. Anything
          # under one is a failed render that produced a valid-looking file.
          if [ "$SIZE" -lt 1000000 ]; then
            echo "Render produced only $SIZE bytes — treating as a failure."
            exit 1
          fi

      # The last word on "does it have a voice".
      #
      # Everything upstream checks inputs: that the mp3s exist, that they are
      # not truncated, that they say what the script says. None of that proves
      # the render actually muxed them in -- `staticFile()` on a bad path does
      # not stop a Remotion render, it just produces silence. So ask the
      # finished file.
      # ffprobe is NOT on a stock ubuntu-latest runner. Remotion ships its own
      # ffmpeg but does not put it on PATH, so this has to be installed --
      # without it the check below read an empty result as "no audio stream" and
      # failed all three renders that had in fact succeeded.
      - name: Install ffmpeg (for ffprobe)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Check the video actually has a voice in it
        working-directory: remotion-ad
        run: |
          set -euo pipefail
          # A missing tool is its own failure, never "the ad is silent". Reading
          # a broken check as a broken ad is how three good renders got thrown
          # away, and it is the more expensive mistake because it looks real.
          if ! command -v ffprobe >/dev/null 2>&1; then
            echo "::error::ffprobe is not installed — cannot verify the audio."
            exit 1
          fi
          STREAMS=$(ffprobe -v error -select_streams a \
            -show_entries stream=codec_type -of csv=p=0 "out/${{ matrix.file }}" | wc -l)
          if [ "$STREAMS" -lt 1 ]; then
            echo "::error::${{ matrix.file }} has NO audio stream — it is a silent ad."
            exit 1
          fi
          DUR=$(ffprobe -v error -select_streams a:0 \
            -show_entries stream=duration -of csv=p=0 "out/${{ matrix.file }}" | head -1)
          echo "audio stream present, ${DUR}s"
          # A 90s ad whose audio track is a couple of seconds long is a render
          # that found one clip and missed twenty-nine.
          if awk "BEGIN{exit !(${DUR:-0} < 60)}"; then
            echo "::error::audio is only ${DUR}s of a 90s ad — most shots are silent."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.ad }}
          path: remotion-ad/out/${{ matrix.file }}
          retention-days: 14

  publish:
    name: Publish the MP4s
    needs: render
    runs-on: ubuntu-latest
    steps:
      - name: Collect the three ads
        uses: actions/download-artifact@v4
        with:
          path: ads
          pattern: orbit-*
          merge-multiple: true

      - name: List what will be published
        run: ls -la ads

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Launch ads (${{ inputs.tag }})
          body: |
            Three complete 90-second vertical launch ads (1080x1920, 30fps).
            Each is a standalone spot, not a cut of one longer film.

            | File | Angle | Voice |
            |---|---|---|
            | `orbit-the-pattern.mp4` | The repeats are already counted | en-US-AvaNeural |
            | `orbit-2am.mp4` | The night before the exam | en-US-JennyNeural |
            | `orbit-draw-it-from-memory.mp4` | The diagram is where the marks are | en-US-AriaNeural |

            Scripts and the reasoning behind each hook are in
            `.agents/video/AD-SCRIPTS.md`.
          files: ads/*.mp4

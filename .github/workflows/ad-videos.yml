# Render the three launch ads to MP4 and publish them as a GitHub Release.
#
# This runs in CI rather than in an agent sandbox for one concrete reason: the
# sandbox's proxy denies both speech.platform.bing.com (so there is no
# voiceover) and the Supabase storage host (so the medical plates and the notes
# screens cannot load). A runner has open network, so it can capture clean
# screens, download the real plates, synthesise the voice, and render.
#
# Each ad is a complete, standalone 90-second spot. They render as three
# parallel jobs because they are three separate videos, never chapters of one.

name: Ad videos

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag for the MP4s (e.g. ads-1)'
        required: true
        default: 'ads-1'
  # A change to the ads renders the ads.
  #
  # This was dispatch-only, and that is how nine rewrites — a whole new end
  # card with the Play logo, new hooks, the statistics taken out of the muted
  # captions — sat on `main` for a day while the published MP4s were the cut
  # from before any of them. Run 19 started at 07:18 and the first of those
  # commits landed at 07:27, so the render was already stale when it finished.
  #
  # Nothing said so, and nothing could: a rendered video is not compared to
  # anything, so "the ads are published" and "the ads are published FROM THIS
  # CODE" looked identical from the outside. The Android builds have not had
  # this problem because a push to `main` cuts one; the ads now work the same
  # way. Documentation-only edits are excluded, since they change no frame.
  push:
    branches: [main]
    paths:
      - 'remotion-ad/**'
      - '!remotion-ad/**.md'
      - '.github/workflows/ad-videos.yml'

# A burst of ad commits should produce ONE render, of the state they ended in.
# Nine renders of nine intermediate states is most of a day of runner time to
# publish eight videos nobody wanted. The newest push wins; a manual dispatch
# is cancelled by a later push for the same reason.
concurrency:
  group: ad-videos
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  assets:
    name: Capture screens, plates and voiceovers
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the app's deps (for the screenshot harness)
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Install the renderer's deps
        working-directory: remotion-ad
        run: npm install --legacy-peer-deps

      - name: Install Chromium for the screenshot harness
        working-directory: mobile
        run: npx playwright-core install chromium --with-deps

      # Plates BEFORE screens, and the order is load-bearing rather than tidy.
      # Two of the captured screens are note screens that draw a medical plate;
      # with no plate on disk the harness draws a stand-in (a white rectangle
      # with the diagram's name on it) or renders "this diagram could not be
      # loaded". Both of those have reached a published ad.
      - name: Download the real medical plates
        working-directory: remotion-ad
        run: npm run plates

      - name: Capture the real app screens
        working-directory: remotion-ad
        run: npm run screens

      # The music beds are synthesised, not sourced -- see make-beds.py for the
      # licence reasoning. They are gitignored like every other asset, so they
      # have to be built here.
      #
      # This step did not exist, and nothing else generates them: the reels'
      # preflight would have failed on a missing bed the first time this
      # workflow ran with them in it, and the two subtitle-led reels have no
      # voice at all, so for those the bed is the ONLY audio in the file.
      - name: Generate the music beds
        working-directory: remotion-ad
        run: python3 scripts/make-beds.py

      - name: Install edge-tts
        run: pip install edge-tts

      # `npm run voice` writes the manifest AND runs the synthesiser. It used to
      # only write the manifest, which meant CI never re-recorded anything and
      # the committed clips could drift away from the script -- orbit-2am had
      # done exactly that, and would have shipped an ad whose voice contradicted
      # its own captions.
      #
      # If Microsoft's endpoint is unreachable this step fails and no ad is
      # published. That is the intended trade: an ad with no voice is not an ad.
      - name: Synthesise the voiceovers
        working-directory: remotion-ad
        run: npm run voice

      # Nothing renders until every asset a script names is present and is not
      # a blank capture. This is the guard against shipping a cut with "this
      # diagram could not be loaded" in it, which has happened before -- and now
      # also against a silent shot, which is worse because it looks finished.
      - name: Preflight
        working-directory: remotion-ad
        run: npm run preflight

      - name: The caption fits its band, and nothing is drawn under it
        working-directory: remotion-ad
        run: npm run check:reel-layout

      - name: Every line matches the screenshot under it
        working-directory: remotion-ad
        run: npm run check:ad-truth

      # `public/audio` now carries a `shot_NN.words.json` beside every mp3 —
      # when each word of that line is actually spoken, straight from the
      # Speech service. The render jobs re-derive the timing tables from those,
      # so they travel with the clips they describe and cannot get out of step
      # with them.
      - name: Share the assets with the render jobs
        uses: actions/upload-artifact@v4
        with:
          name: ad-assets
          path: |
            remotion-ad/public/app_screens
            remotion-ad/public/audio
          retention-days: 1

  render:
    name: Render ${{ matrix.ad }}
    needs: assets
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # The 90-second launch ads, each in two cuts like every reel. They
          # were the only three shipping in one, because they were written
          # before the silent cut existed and nothing re-checked them.
          - ad: orbit-the-pattern
            file: orbit-the-pattern.mp4
          - ad: orbit-the-pattern-silent
            file: orbit-the-pattern-silent.mp4
          - ad: orbit-2am
            file: orbit-2am.mp4
          - ad: orbit-2am-silent
            file: orbit-2am-silent.mp4
          - ad: orbit-draw-it-from-memory
            file: orbit-draw-it-from-memory.mp4
          - ad: orbit-draw-it-from-memory-silent
            file: orbit-draw-it-from-memory-silent.mp4
          # The 60-second Instagram reels, each in two cuts. The silent one is
          # not an afterthought: most reels are watched muted, so it is the cut
          # that has to work without a word being heard.
          - ad: orbit-reel-repeats
            file: orbit-reel-repeats.mp4
          - ad: orbit-reel-repeats-silent
            file: orbit-reel-repeats-silent.mp4
            silent: true
          - ad: orbit-reel-six-hours
            file: orbit-reel-six-hours.mp4
          - ad: orbit-reel-six-hours-silent
            file: orbit-reel-six-hours-silent.mp4
            silent: true
          - ad: orbit-reel-draw-it
            file: orbit-reel-draw-it.mp4
          - ad: orbit-reel-draw-it-silent
            file: orbit-reel-draw-it-silent.mp4
            silent: true
          # The mascot ad: the app's own chat avatar hosting sixty seconds,
          # female voice, deliberately unhurried.
          - ad: orbit-reel-guide
            file: orbit-reel-guide.mp4
          - ad: orbit-reel-guide-silent
            file: orbit-reel-guide-silent.mp4
            silent: true
          # Two more with the same host. "Ask me anything" watches it do one
          # question end to end instead of touring the app; "It is late" is the
          # only mascot ad with a pain hook, and the only reel that closes on
          # the morning rather than on the product.
          - ad: orbit-reel-guide-answer
            file: orbit-reel-guide-answer.mp4
          - ad: orbit-reel-guide-answer-silent
            file: orbit-reel-guide-answer-silent.mp4
            silent: true
          - ad: orbit-reel-guide-night
            file: orbit-reel-guide-night.mp4
          - ad: orbit-reel-guide-night-silent
            file: orbit-reel-guide-night-silent.mp4
            silent: true
          # These two were written subtitle-led, with no spoken track at all,
          # and so rendered once each. They have a voice now: the app owner
          # asked for every ad to exist both ways, and "no voice" was a
          # property of two scripts rather than a choice about the campaign.
          # Their captions were already standalone, so each became the shot's
          # `silentText` and the spoken line was written around it.
          - ad: orbit-reel-functions
            file: orbit-reel-functions.mp4
          - ad: orbit-reel-functions-silent
            file: orbit-reel-functions-silent.mp4
          - ad: orbit-reel-one-question
            file: orbit-reel-one-question.mp4
          - ad: orbit-reel-one-question-silent
            file: orbit-reel-one-question-silent.mp4

          # The eleven feature reels. Each is voiced, so each renders twice —
          # once with the voice and once as the silent cut, which is the one
          # most people watch. They are one argument each, on purpose: an ad
          # that covers everything is an ad nobody finishes.
          - ad: orbit-reel-anki
            file: orbit-reel-anki.mp4
          - ad: orbit-reel-anki-silent
            file: orbit-reel-anki-silent.mp4
          - ad: orbit-reel-attendance
            file: orbit-reel-attendance.mp4
          - ad: orbit-reel-attendance-silent
            file: orbit-reel-attendance-silent.mp4
          - ad: orbit-reel-second-year
            file: orbit-reel-second-year.mp4
          - ad: orbit-reel-second-year-silent
            file: orbit-reel-second-year-silent.mp4
          - ad: orbit-reel-setup
            file: orbit-reel-setup.mp4
          - ad: orbit-reel-setup-silent
            file: orbit-reel-setup-silent.mp4
          - ad: orbit-reel-pages
            file: orbit-reel-pages.mp4
          - ad: orbit-reel-pages-silent
            file: orbit-reel-pages-silent.mp4
          - ad: orbit-reel-first-year
            file: orbit-reel-first-year.mp4
          - ad: orbit-reel-first-year-silent
            file: orbit-reel-first-year-silent.mp4
          - ad: orbit-reel-spaced
            file: orbit-reel-spaced.mp4
          - ad: orbit-reel-spaced-silent
            file: orbit-reel-spaced-silent.mp4
          - ad: orbit-reel-progress
            file: orbit-reel-progress.mp4
          - ad: orbit-reel-progress-silent
            file: orbit-reel-progress-silent.mp4
          - ad: orbit-reel-reminder
            file: orbit-reel-reminder.mp4
          - ad: orbit-reel-reminder-silent
            file: orbit-reel-reminder-silent.mp4
          - ad: orbit-reel-yours
            file: orbit-reel-yours.mp4
          - ad: orbit-reel-yours-silent
            file: orbit-reel-yours-silent.mp4
          - ad: orbit-reel-notes
            file: orbit-reel-notes.mp4
          - ad: orbit-reel-notes-silent
            file: orbit-reel-notes-silent.mp4
          # The walkthroughs: where a feature is and what to tap first.
          - ad: orbit-reel-how-notes
            file: orbit-reel-how-notes.mp4
          - ad: orbit-reel-how-notes-silent
            file: orbit-reel-how-notes-silent.mp4
          - ad: orbit-reel-how-attendance
            file: orbit-reel-how-attendance.mp4
          - ad: orbit-reel-how-attendance-silent
            file: orbit-reel-how-attendance-silent.mp4
          - ad: orbit-reel-how-pages
            file: orbit-reel-how-pages.mp4
          - ad: orbit-reel-how-pages-silent
            file: orbit-reel-how-pages-silent.mp4
          - ad: orbit-reel-how-timer
            file: orbit-reel-how-timer.mp4
          - ad: orbit-reel-how-timer-silent
            file: orbit-reel-how-timer-silent.mp4
          - ad: orbit-reel-third-year
            file: orbit-reel-third-year.mp4
          - ad: orbit-reel-third-year-silent
            file: orbit-reel-third-year-silent.mp4
          - ad: orbit-reel-final-year
            file: orbit-reel-final-year.mp4
          - ad: orbit-reel-final-year-silent
            file: orbit-reel-final-year-silent.mp4
          # The two flat, typographic ads. A different renderer (`HyperAd`) and
          # a different argument — one is a question being answered, the other
          # is the four years. Both ship in two cuts like everything else.
          - ad: orbit-ask-it
            file: orbit-ask-it.mp4
          - ad: orbit-ask-it-silent
            file: orbit-ask-it-silent.mp4
          - ad: orbit-the-year
            file: orbit-the-year.mp4
          - ad: orbit-the-year-silent
            file: orbit-the-year-silent.mp4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the renderer's deps
        working-directory: remotion-ad
        run: npm install --legacy-peer-deps

      - name: Pull the assets
        uses: actions/download-artifact@v4
        with:
          name: ad-assets
          path: remotion-ad/public

      # The captions read a generated module to know when each word is spoken,
      # and the long-form ads take their shot lengths from the same
      # measurements. Both are rebuilt here, from the very clips this job is
      # about to mux, rather than trusted from the repo.
      #
      # The committed copy of `src/generated/voiceTimings.ts` is empty on
      # purpose: a checked-in measurement is a measurement of an older
      # recording, and laying new audio out on old boundaries is exactly the
      # drift that put every ad's captions out of step with its voice.
      - name: Measure the recordings
        working-directory: remotion-ad
        run: npm run measure

      - name: Preflight
        working-directory: remotion-ad
        run: npm run preflight

      - name: The caption fits its band, and nothing is drawn under it
        working-directory: remotion-ad
        run: npm run check:reel-layout

      - name: Every line matches the screenshot under it
        working-directory: remotion-ad
        run: npm run check:ad-truth

      - name: Render
        working-directory: remotion-ad
        run: |
          npx remotion render "${{ matrix.ad }}" "out/${{ matrix.file }}" \
            --concurrency=2 --log=info

      - name: Check the file is a real video, not an empty container
        working-directory: remotion-ad
        run: |
          SIZE=$(stat -c%s "out/${{ matrix.file }}")
          echo "${{ matrix.file }} is $SIZE bytes"
          # 90 seconds of 1080x1920 at CRF 18 is several megabytes. Anything
          # under one is a failed render that produced a valid-looking file.
          if [ "$SIZE" -lt 1000000 ]; then
            echo "Render produced only $SIZE bytes — treating as a failure."
            exit 1
          fi

      # The last word on "does it have a voice".
      #
      # Everything upstream checks inputs: that the mp3s exist, that they are
      # not truncated, that they say what the script says. None of that proves
      # the render actually muxed them in -- `staticFile()` on a bad path does
      # not stop a Remotion render, it just produces silence. So ask the
      # finished file.
      # ffprobe is NOT on a stock ubuntu-latest runner. Remotion ships its own
      # ffmpeg but does not put it on PATH, so this has to be installed --
      # without it the check below read an empty result as "no audio stream" and
      # failed all three renders that had in fact succeeded.
      - name: Install ffmpeg (for ffprobe)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Check the video actually has a voice in it
        working-directory: remotion-ad
        run: |
          set -euo pipefail
          # A missing tool is its own failure, never "the ad is silent". Reading
          # a broken check as a broken ad is how three good renders got thrown
          # away, and it is the more expensive mistake because it looks real.
          if ! command -v ffprobe >/dev/null 2>&1; then
            echo "::error::ffprobe is not installed — cannot verify the audio."
            exit 1
          fi
          STREAMS=$(ffprobe -v error -select_streams a \
            -show_entries stream=codec_type -of csv=p=0 "out/${{ matrix.file }}" | wc -l)
          if [ "$STREAMS" -lt 1 ]; then
            echo "::error::${{ matrix.file }} has NO audio stream — it is a silent ad."
            exit 1
          fi
          AUDIO=$(ffprobe -v error -select_streams a:0 \
            -show_entries stream=duration -of csv=p=0 "out/${{ matrix.file }}" | head -1)
          VIDEO=$(ffprobe -v error -select_streams v:0 \
            -show_entries stream=duration -of csv=p=0 "out/${{ matrix.file }}" | head -1)
          echo "audio ${AUDIO}s of video ${VIDEO}s"
          # Measured against the file's OWN length rather than a hardcoded 90,
          # because the reels are 60s and a fixed threshold would either pass a
          # broken reel or fail a good one. A render that found one clip and
          # missed the rest shows up as an audio track far shorter than the
          # picture it is under.
          if awk "BEGIN{exit !(${AUDIO:-0} < ${VIDEO:-1} * 0.8)}"; then
            echo "::error::audio is only ${AUDIO}s under ${VIDEO}s of video — most of it is silent."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.ad }}
          path: remotion-ad/out/${{ matrix.file }}
          retention-days: 14

      # Publish THIS ad now, rather than waiting for the other twelve.
      #
      # The release used to be written by a single job behind `needs: render`,
      # so nothing reached GitHub until the slowest render in the matrix
      # finished — and if one of them failed, thirteen good renders were
      # published as nothing at all. A ninety-second 1080x1920 render is the
      # better part of an hour; the owner asked to be able to watch them arrive.
      #
      # `gh release create` is allowed to fail because thirteen jobs race to be
      # the first to need it and only one can win; the losers find it already
      # there, which is the outcome all of them wanted. `--clobber` makes the
      # upload itself idempotent, so a re-run replaces its own asset instead of
      # erroring on a name that is taken. The final `publish` job then writes
      # the real release notes over the placeholder.
      - name: Publish this ad to the release
        working-directory: remotion-ad
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `inputs.tag` is empty on a push, so the run number names it.
          TAG: ${{ inputs.tag || format('ads-r{0}', github.run_number) }}
        run: |
          set -uo pipefail
          gh release create "$TAG" \
            --title "Launch ads ($TAG)" \
            --notes "Renders are being published as each one finishes. The full notes land when the matrix completes." \
            || echo "release $TAG already exists — uploading into it"
          for attempt in 1 2 3 4; do
            if gh release upload "$TAG" "out/${{ matrix.file }}" --clobber; then
              echo "published ${{ matrix.file }}"
              exit 0
            fi
            echo "upload attempt $attempt failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::could not upload ${{ matrix.file }} after four attempts"
          exit 1

  # Every ad has already been uploaded by its own render job. This job exists
  # to replace the placeholder notes with the real ones, and to say out loud
  # which files actually made it — a matrix entry that failed is a file that is
  # missing from the release, and that is worth seeing in one place.
  publish:
    name: Finish the release notes
    needs: render
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Collect the three ads
        uses: actions/download-artifact@v4
        with:
          path: ads
          pattern: orbit-*
          merge-multiple: true

      - name: List what will be published
        run: ls -la ads

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || format('ads-r{0}', github.run_number) }}
          name: Launch ads (${{ inputs.tag || format('ads-r{0}', github.run_number) }})
          body: |
            Eleven ads, nineteen files. Every one is a standalone spot, not a cut
            of one longer film, and each was uploaded by its own render job as
            it finished rather than all at the end.

            **Three 90-second vertical launch ads** (1080x1920, 30fps), paced by
            their own recorded voiceover.

            | File | Angle | Voice |
            |---|---|---|
            | `orbit-the-pattern.mp4` | The repeats are already counted | en-US-AvaNeural |
            | `orbit-2am.mp4` | The night before the exam | en-US-JennyNeural |
            | `orbit-draw-it-from-memory.mp4` | The diagram is where the marks are | en-US-AriaNeural |

            **Six 60-second voiced reels, each in two cuts.** Three of them are hosted
            by the app's own chat mascot: a tour, a worked question, and the night
            before the exam. The `-silent` cut
            has no voiceover and carries itself on the music bed and the
            on-screen text, because most reels are watched muted.

            | File | Cut |
            |---|---|
            | `orbit-reel-repeats.mp4` | voiced |
            | `orbit-reel-repeats-silent.mp4` | music only |
            | `orbit-reel-six-hours.mp4` | voiced |
            | `orbit-reel-six-hours-silent.mp4` | music only |
            | `orbit-reel-draw-it.mp4` | voiced |
            | `orbit-reel-draw-it-silent.mp4` | music only |
            | `orbit-reel-guide.mp4` | voiced — the app's own mascot hosts |
            | `orbit-reel-guide-silent.mp4` | music only |
            | `orbit-reel-guide-answer.mp4` | voiced — the mascot works one question end to end |
            | `orbit-reel-guide-answer-silent.mp4` | music only |
            | `orbit-reel-guide-night.mp4` | voiced — the mascot at two in the morning |
            | `orbit-reel-guide-night-silent.mp4` | music only |

            **Two 60-second reels with no voiceover at all** — the caption names
            a real function on every shot, on a black ground, cut to a declared
            tempo. Swap the bed for your own track at the same tempo and every
            cut still lands on a beat; a different tempo is one number in the
            script. `.agents/video/BEAT-SYNC.md` is the contract.

            | File | Cut to |
            |---|---|
            | `orbit-reel-functions.mp4` | 100 BPM — every function, one per shot |
            | `orbit-reel-one-question.mp4` | 120 BPM — one question, end to end |

            ### What the captions and the voice agree about

            Every caption is now synchronised to the recording rather than to a
            guess. The synthesiser reports when it says each word, those
            boundaries are measured in the same CI run that records them, and
            the captions highlight against them — so a lit word is the word in
            the air. A voiced reel's headline is a verbatim phrase from the line
            spoken under it, and the render is refused if that stops being true.

            ### The numbers in these ads

            Measured from the shipped bank and the live diagram table:
            **5,634 questions**, **3,463** of them carrying a repeat marker, and
            **250 hand-drawn plates** attached to **922 questions**.

            The music is synthesised by `remotion-ad/scripts/make-beds.py` and
            owned outright — no stock track, because "free for non-commercial"
            does not cover an advertisement for a paid app.

            Scripts and the reasoning behind each hook are in
            `.agents/video/AD-SCRIPTS.md`.
          files: ads/*.mp4

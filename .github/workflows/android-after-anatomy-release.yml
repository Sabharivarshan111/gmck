name: Publish Android builds after verified anatomy audit
on:
  workflow_run:
    workflows: [Verified Android anatomy evidence]
    types: [completed]
permissions:
  contents: read
  actions: write
concurrency:
  group: android-verified-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  publish-verified:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.id == github.repository_id
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch builds only for the audited main commit
        uses: actions/github-script@v7
        with:
          script: |
            const run=context.payload.workflow_run;
            const {data:main}=await github.rest.repos.getBranch({...context.repo,branch:'main'});
            if(main.commit.sha!==run.head_sha)throw Error('Main advanced after audit; wait for its own exact-source verification');
            if(run.path!=='.github/workflows/android-anatomy-evidence-gate.yml')throw Error('Expected exact-source evidence gate');
            const {data:artifacts}=await github.rest.actions.listWorkflowRunArtifacts({...context.repo,run_id:run.id});
            if(!artifacts.artifacts.some(a=>a.name==='verified-android-anatomy-'+run.head_sha&&!a.expired))throw Error('No complete 626-target evidence for this exact app source');
            for(const [workflow_id,inputs] of [['android-debug.yml',{publish_verified:'true'}],['android-internal.yml',{}],['android-release.yml',{build_apk:'true'}]]){
              const {data:existing}=await github.rest.actions.listWorkflowRuns({...context.repo,workflow_id,head_sha:run.head_sha,per_page:30});
              if(existing.workflow_runs.some(r=>r.head_sha===run.head_sha&&r.event==='workflow_dispatch')){core.info(workflow_id+' already dispatched for this source');continue;}
              await github.rest.actions.createWorkflowDispatch({...context.repo,workflow_id,ref:'main',inputs});
              core.info('Started '+workflow_id+' for verified source '+run.head_sha);
            }

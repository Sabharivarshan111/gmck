name: Publish Android builds after verified anatomy audit
on:
  workflow_run:
    workflows: [Full Android anatomy source audit]
    types: [completed]
permissions:
  contents: read
  actions: write
concurrency:
  group: android-verified-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  publish-verified:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.id == github.repository_id
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch builds only for the audited main commit
        uses: actions/github-script@v7
        with:
          script: |
            const run=context.payload.workflow_run;
            const {data:main}=await github.rest.repos.getBranch({...context.repo,branch:'main'});
            if(main.commit.sha!==run.head_sha)throw Error('Main advanced after audit; wait for its own exact-source verification');
            if(run.path!=='.github/workflows/android-v27-full-anatomy.yml')throw Error('Unexpected audit workflow');
            for(const [workflow_id,inputs] of [['android-debug.yml',{publish_verified:'true'}],['android-internal.yml',{}],['android-release.yml',{build_apk:'true'}]]){
              await github.rest.actions.createWorkflowDispatch({...context.repo,workflow_id,ref:'main',inputs});
              core.info('Started '+workflow_id+' for verified source '+run.head_sha);
            }

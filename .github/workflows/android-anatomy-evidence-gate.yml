name: Verified Android anatomy evidence
on:
  workflow_run:
    workflows: [Full Android anatomy source audit]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: anatomy-evidence-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  verify-evidence:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.id == github.repository_id
    runs-on: ubuntu-latest
    steps:
      - name: Require current main and the exact completed source audit
        uses: actions/github-script@v7
        with:
          script: |
            const run=context.payload.workflow_run;
            if(run.path!=='.github/workflows/android-v27-full-anatomy.yml' || run.conclusion!=='success')throw Error('Only a successful complete source audit qualifies');
            const {data:branch}=await github.rest.repos.getBranch({...context.repo,branch:'main'});
            if(branch.commit.sha!==run.head_sha)throw Error('Source changed after audit; require the new source to be verified');
            const {data:artifacts}=await github.rest.actions.listWorkflowRunArtifacts({...context.repo,run_id:run.id,per_page:100});
            const prefix='actual-android-v27-full-context-framing-part';
            const exact=artifacts.artifacts.filter(a=>a.name.startsWith(prefix) && a.name.endsWith('-'+run.head_sha) && !a.expired);
            if(exact.length!==32)throw Error('Missing exact-source 626-target Android partitions: have '+exact.length+'/32');
            core.info('32 complete candidate partition artifacts available from '+run.html_url);
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: actual-android-v27-full-context-framing-part*-${{ github.event.workflow_run.head_sha }}
          path: artifacts/exact-source
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Verify 626/626 render targets, both surfaces, source hashes, screenshots and 32 partitions
        run: node --experimental-strip-types .github/qa/verify-anatomy-complete.mjs artifacts/exact-source "${{ github.event.workflow_run.head_sha }}" verified-anatomy.json
      - uses: actions/upload-artifact@v4
        with:
          name: verified-android-anatomy-${{ github.event.workflow_run.head_sha }}
          path: verified-anatomy.json
          if-no-files-found: error

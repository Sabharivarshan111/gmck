name: Android debug APK

# Builds an installable APK with no secrets and no computer.
#
# The release workflow needs the upload keystore, which is still blocked on the
# Play upload-key reset. This one signs with the standard Android debug key that
# ships in the repo, so it runs today, from the GitHub mobile app:
#
#   Actions → "Android debug APK" → Run workflow → wait → download the artifact
#   → open the .apk on the phone → allow "install unknown apps" once.
#
# It installs as com.aistudio.mbbsqbank.aycxvd.debug, alongside the Play Store
# build rather than replacing it. Debug builds serve Google's TEST ads only.
#
# Note: Expo Go cannot run this app — it is bare React Native with native
# modules (Google Sign-In, AdMob) that Expo Go does not contain. This APK is
# the way to get it on a phone.
#
# Why the JS bundle is built by hand below, rather than left to Gradle:
#
# The React Native Gradle plugin registers no bundle task at all for a
# debuggable variant (TaskConfiguration.kt: `if (!isDebuggableVariant)`), on
# the assumption that a debug app loads its JS from Metro over USB. An APK
# built that way and opened on a phone with no computer attached shows the red
# "Unable to load script" screen and nothing else — which is exactly how this
# artifact is meant to be used, so it has to carry its own bundle.
#
# `--dev true` is deliberate and load-bearing. The same plugin hardcodes
# `devEnabled = false` for every variant it does bundle, and `__DEV__` false is
# what switches src/lib/ads.ts from Google's test ad units to the live ones.
# Serving yourself live ads is an AdMob policy violation that can get the
# account suspended, so a build meant for self-testing must keep __DEV__ true.
# That is also why this cannot simply be `assembleRelease` with the debug key.
#
# The cost: a dev bundle is unminified and keeps its dev-time checks, so it is
# bigger and slower than what ships. Fine for "does this work?" — not a fair
# measurement of performance on a low-end phone.

# Two triggers, and the push one is not a convenience.
#
# GitHub only offers "Run workflow" for a workflow that exists on the
# repository's **default branch** — the dispatch API 404s otherwise. This file
# lives on the feature branch, so until it is merged, workflow_dispatch cannot
# reach it from anywhere: not from the Actions tab, not from the API. A push
# trigger runs from whatever branch was pushed, which is the only way to get an
# APK out of this branch today.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/android-react-native-app-o54cjj
      - claude/native-app-sync

permissions:
  # Needed by the release step below; the default token is read-only.
  contents: write

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Lint
        working-directory: mobile
        run: npx eslint .

      # The cheap checks, before the ten-minute part. Each one guards a bug that
      # shipped: MCQs generated by the wrong system prompt, Notes 400ing on
      # three topics, progress never reaching the cloud after onboarding, and
      # one tick re-rendering every row in the list.
      - name: Checks
        working-directory: mobile
        run: |
          npm run check:fanout
          npm run check:mcq
          npm run check:notes-limits
          npm run check:sync
          npm run check:theme-from-image
          npm run check:glass
          npm run check:sounds
          npm run check:native-sound
          npm run check:subject-cards

      # Test ads are chosen in source now, not by the bundler's dev flag —
      # see mobile/src/lib/adsMode.ts. Overwriting it here is what lets this
      # build ship optimised, minified JavaScript and still be incapable of
      # showing a live ad.
      #
      # There is no hand-rolled bundle step any more. The React Native Gradle
      # plugin bundles `preview` itself, optimised, because that variant is
      # deliberately absent from `debuggableVariants`. The old step existed to
      # force `--dev true`, which is exactly what made every test build several
      # times slower than the shipped app.
      - name: Build with no ads at all
        working-directory: mobile
        run: printf 'export const ADS_ENABLED = false;\n' > src/lib/adsMode.ts

      # Two runs died here, and both causes are worth writing down.
      #
      # API 37 is published with a **minor version**: the package is
      # `platforms;android-37.0`, and `platforms;android-37` does not exist.
      # And sdkmanager fails the *entire* invocation when one package name is
      # unknown — so that single wrong name also stopped the NDK, which was
      # available all along, from being installed. Hence one package per call.
      #
      # Only what is genuinely missing is fetched: the runner image already
      # ships most of this, and installing it again is ten minutes of nothing.
      - name: Install the SDK components the build pins
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          echo "SDK root: $SDK"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true

          # Tries each spelling in turn; the platform has had two.
          install_one() {
            for candidate in "$@"; do
              if "$SDKM" "$candidate"; then
                echo "installed $candidate"
                return 0
              fi
              echo "not available: $candidate"
            done
            echo "::error::none of these could be installed: $*"
            return 1
          }

          [ -d "$SDK/platforms/android-37" ] || [ -d "$SDK/platforms/android-37.0" ] \
            || install_one "platforms;android-37.0" "platforms;android-37"
          [ -d "$SDK/build-tools/37.0.0" ] || install_one "build-tools;37.0.0"
          [ -d "$SDK/ndk/27.1.12297006" ] || install_one "ndk;27.1.12297006"

          echo "platforms:   $(ls "$SDK/platforms" 2>/dev/null | tr '\n' ' ')"
          echo "build-tools: $(ls "$SDK/build-tools" 2>/dev/null | tr '\n' ' ')"
          echo "ndk:         $(ls "$SDK/ndk" 2>/dev/null | tr '\n' ' ')"

      # Printed before the build so a failure log opens with the versions that
      # produced it, rather than requiring a second run to find out.
      - name: Toolchain versions
        working-directory: mobile/android
        run: |
          java -version
          node --version
          ./gradlew --version

      # Sign the test build with the **upload key** when the repository has
      # one, rather than the standard debug key.
      #
      # This reuses the secrets the release workflow already expects —
      # ANDROID_KEYSTORE_BASE64 / ANDROID_STORE_PASSWORD / ANDROID_KEY_PASSWORD,
      # alias `upload` — so there is nothing new to add if releases were ever
      # set up. When they are absent the step is skipped and the build falls
      # back to the debug key, which is why this cannot break anything.
      #
      # Why bother: Google Sign-In identifies an app by its signing
      # certificate, so a test build signed with a throwaway key cannot sign
      # in no matter what else is correct.
      #
      # The condition tests `env`, not `secrets`: the secrets context is not
      # available in a step's `if`, and referencing it there silently
      # evaluates to empty — the step would never run and nothing would say
      # why. Mapping it into env first is the documented way round that.
      - name: Sign the debug build with the upload key, if the repo has one
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug-signing.jks"
          echo "DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/debug-signing.jks" >> "$GITHUB_ENV"
          echo "Upload key found; the debug APK will be signed with it."

      - name: Build the preview APK
        env:
          DEBUG_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: mobile/android
        # --stacktrace because the first line of an AGP failure is rarely the
        # useful one, and a re-run costs ten minutes.
        run: ./gradlew assemblePreview --no-daemon --stacktrace

      # Google Sign-In identifies an app by **package name + signing
      # certificate**, so this pair is what has to exist as an Android OAuth
      # client in Google Cloud before sign-in works in this build. Printed on
      # every run rather than written down somewhere, because it changes the
      # moment the signing key does — and the symptom when it is wrong is a
      # sign-in that fails with no useful message on the phone.
      - name: Print what Google Sign-In has to be registered against
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APK=$(ls mobile/android/app/build/outputs/apk/preview/*.apk | head -1)
          echo "package name: com.aistudio.mbbsqbank.aycxvd.debug"
          "$SDK"/build-tools/37.0.0/apksigner verify --print-certs "$APK" \
            | grep -iE "SHA-1|SHA-256" || echo "(apksigner could not read the APK)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orbit-debug-apk
          path: mobile/android/app/build/outputs/apk/preview/*.apk
          if-no-files-found: error

      # An Actions *artifact* is a zip that only a signed-in user can fetch,
      # from a page the GitHub mobile app does not even show. Installing from
      # a phone — which is the entire point of this workflow — therefore does
      # not work, and the failure is silent: you get a page with no download
      # on it and no explanation.
      #
      # A release asset is a plain file on a plain URL. It downloads in the
      # phone's browser, signed in or not, and Android opens it directly.
      # Same APK, reachable.
      - name: Publish the APK where a phone can download it
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.run_number }}
          name: Debug APK (build ${{ github.run_number }})
          body: |
            Installable debug build of the Orbit MBBS native app.

            **Download `orbit-debug.apk` below and open it on your phone.**
            Android will ask once for permission to install from this source.

            Installs as `com.aistudio.mbbsqbank.aycxvd.debug`, alongside the
            Play Store app rather than replacing it. Serves Google's **test**
            ads only, never live ones.

            Built from `${{ github.sha }}`.
          files: mobile/android/app/build/outputs/apk/preview/*.apk
          prerelease: true
          make_latest: false

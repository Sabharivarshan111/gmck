name: Internal APK (real package, real key)

# The build that can actually sign in.
#
# Google Sign-In matches an app on **package name and signing certificate**.
# The debug APK deliberately fails both — it carries a `.debug` suffix so it
# installs beside the Play Store copy, and it is signed with the throwaway
# Android debug key — so sign-in can never work there. This variant keeps the
# real applicationId (com.aistudio.mbbsqbank.aycxvd) and signs with the real
# upload key.
#
# Two consequences, both real:
#
#   1. **The Play Store copy has to be uninstalled first.** Same package name,
#      different signature, so Android refuses the install. Anything saved
#      only on the device goes with it; anything synced to Supabase comes
#      back on sign-in — which is the thing this build exists to test.
#
#   2. **An OAuth client must exist** in Google Cloud for
#      com.aistudio.mbbsqbank.aycxvd with the SHA-1 this workflow prints.
#      The published app's client uses Play's app-signing certificate, which
#      is a *different* certificate from the upload key, so it does not cover
#      this build. Adding the printed SHA-1 is one entry in the console.
#
# What this build does NOT take from a release build is live ads. The JS is
# bundled by hand with `--dev true`, so `__DEV__` stays true and src/lib/ads.ts
# keeps serving Google's test units. An APK we install ourselves must never be
# able to show us a live ad — that is an AdMob policy violation that can get
# the account suspended.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/native-app-sync

permissions:
  contents: write

jobs:
  internal-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Checks
        working-directory: mobile
        run: |
          npm run check:fanout
          npm run check:mcq
          npm run check:notes-limits
          npm run check:notes-schema
          npm run check:sync
          npm run check:cloud-ids
          npm run check:native-sound
          npm run check:subject-cards
          npm run check:agent-docs
          npm run check:payments

      # Test ads come from source, not from the bundler's dev flag — see
      # mobile/src/lib/adsMode.ts. The Gradle plugin bundles this variant
      # itself, optimised and minified, which is why there is no hand-rolled
      # bundle step: forcing `--dev true` to get test ads was what made every
      # test build several times slower than the shipped app.
      - name: Build with no ads at all
        working-directory: mobile
        run: printf 'export const ADS_ENABLED = false;\n' > src/lib/adsMode.ts

      - name: Install the SDK components the build pins
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          install_one() {
            for candidate in "$@"; do
              if "$SDKM" "$candidate"; then
                echo "installed $candidate"
                return 0
              fi
            done
            echo "::error::none of these could be installed: $*"
            return 1
          }
          [ -d "$SDK/platforms/android-37" ] || [ -d "$SDK/platforms/android-37.0" ] \
            || install_one "platforms;android-37.0" "platforms;android-37"
          [ -d "$SDK/build-tools/37.0.0" ] || install_one "build-tools;37.0.0"
          [ -d "$SDK/ndk/27.1.12297006" ] || install_one "ndk;27.1.12297006"

      # Required here, unlike in the debug workflow: without the real key this
      # build has no reason to exist, and silently falling back to the debug
      # key would produce an APK that looks right and cannot sign in.
      - name: Decode the upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Add the upload keystore under Settings → Secrets and variables → Actions, along with ANDROID_STORE_PASSWORD and ANDROID_KEY_PASSWORD."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "keystore decoded"

      - name: Build internal APK
        working-directory: mobile/android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleInternal --no-daemon --stacktrace

      - name: Print what Google Sign-In has to be registered against
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APK=$(ls mobile/android/app/build/outputs/apk/internal/*.apk | head -1)
          echo "package name: com.aistudio.mbbsqbank.aycxvd"
          "$SDK"/build-tools/37.0.0/apksigner verify --print-certs "$APK" \
            | grep -iE "SHA-1|SHA-256" || echo "(apksigner could not read the APK)"

      - name: Publish the APK where a phone can download it
        uses: softprops/action-gh-release@v2
        with:
          tag_name: internal-${{ github.run_number }}
          name: Internal APK (build ${{ github.run_number }})
          body: |
            Real package name, real upload key — **Google Sign-In works in
            this build**, once its SHA-1 is registered in Google Cloud.

            **Uninstall the Play Store copy of Orbit MBBS before installing
            this.** Same package name with a different signature, so Android
            will refuse the install otherwise.

            Ads are still Google's **test** units, never live ones.

            Built from `${{ github.sha }}`.
          files: mobile/android/app/build/outputs/apk/internal/*.apk
          prerelease: true
          make_latest: false

name: Android release build

# Produces a signed .aab to upload to Play, and a signed .apk for sideloading,
# both published to a GitHub release so they can be fetched from a phone.
#
# This build serves **live ads**. That is the difference from the debug and
# preview builds, which overwrite src/lib/adsMode.ts to disable AdMob entirely
# — serving yourself live ads is an AdMob policy violation. Nothing here
# touches that file, so ADS_ENABLED stays `!__DEV__`, which is true in a
# release bundle. The "Confirm this build serves live ads" step below asserts
# it rather than trusting it.
#
# Two triggers, and the push one is not a convenience: GitHub only offers
# "Run workflow" for a workflow that exists on the repository's **default**
# branch, and the dispatch API 404s otherwise. Until this branch is merged,
# a push is the only way to start it.
on:
  workflow_dispatch:
    # Candidate builds are held as artifacts until device checks are reviewed.
    inputs:
      build_apk:
        description: 'Also build an APK for direct install'
        type: boolean
        default: true
  push:
    branches:
      # main included so a merge here cuts a release with no API access
      # needed — see the note in android-debug.yml.
      - main
      - codex/v27-parity-repairs-20261016
      - codex/v27-brain-registration-20261016
      - codex/v27-context-camera-20261016
      - codex/v27-fresh-rebuild-20261016
      - codex/v27-mobile-controls-20261016
      - claude/native-app-sync
      - codex/native-web-parity
      - chatgpt/android-onboarding-release-20261031
    # Documentation-only handoff commits must not cancel an AAB/APK that is
    # already building. Rebuild only when code/assets that can reach the
    # native artifact (or this workflow itself) change.
    paths:
      - 'mobile/**'
      - 'src/**'
      - 'public/**'
      - '.github/workflows/android-release.yml'

# One run per branch, and a new artifact-affecting push cancels the one it supersedes.
#
# Documentation-only pushes are filtered above, so they cannot abort a valid
# native build. Code/assets that change the artifact still supersede older runs.
#
# Without this every relevant push started a fresh build while the previous one — now
# building code nobody will ship — kept a runner for its full twenty minutes.
# Six workflows fire on each push across two remotes, so a few pushes in a row
# saturated the queue and GitHub began answering `startup_failure`: a
# previously-green workflow simply refusing to start, which reads as a broken
# pipeline rather than a full one.
#
# Cancelling is safe here because the artifact was already obsolete. The commit
# that replaced it is the one worth building.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # The release step needs write; the default token is read-only.
  contents: write
  actions: read

jobs:
  build:
    if: github.event_name != 'push' || github.ref_name != 'main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Require complete 626-target evidence for the application source
        if: github.ref_name == 'main'
        uses: actions/github-script@v7
        with:
          script: |
            let verified=null;
            for(const workflow_id of ['android-v27-full-anatomy.yml','android-anatomy-evidence-gate.yml']){
              const {data}=await github.rest.actions.listWorkflowRuns({...context.repo,workflow_id,head_sha:context.sha,status:'success',per_page:20});
              for(const run of data.workflow_runs.filter(r=>r.head_sha===context.sha&&r.head_branch==='main'&&r.conclusion==='success')){
                if(workflow_id==='android-anatomy-evidence-gate.yml'){
                  const {data:artifacts}=await github.rest.actions.listWorkflowRunArtifacts({...context.repo,run_id:run.id});
                  if(!artifacts.artifacts.some(a=>a.name==='verified-android-anatomy-'+context.sha&&!a.expired))continue;
                }
                verified=run;break;
              }
              if(verified)break;
            }
            if(!verified)throw Error('No complete626 Android evidence for this application source; publication is blocked');
            core.info('Verified Android evidence: '+verified.html_url);
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Clean before generating renderer assets under app/build; cleaning in
      # the assemble invocation deletes those newly generated required files.
      - name: Clean Android outputs before generating local assets
        working-directory: mobile/android
        run: ./gradlew clean --no-daemon --no-build-cache

      - name: Bundle the local canonical anatomy and diagnostic renderer
        working-directory: .
        run: |
          npm ci --legacy-peer-deps --ignore-scripts
          node scripts/zanatomy-reference-registration-check.mjs
          node mobile/scripts/build-local-simulator.mjs
          node mobile/scripts/clinical-snapshot-check.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The same guards the debug build runs. A release is the one build where
      # shipping a known-broken feature actually reaches people.
      - name: Checks
        run: |
          node ../scripts/build-pg-compact.mjs
          node ../scripts/check-pg-release-content.mjs
          npm run check:fanout
          npm run check:mcq
          npm run check:notes-limits
          npm run check:notes-schema
          npm run check:v25
          npm run check:kuhs-parity
          npm run check:university-import
          npm run check:notes-depth
          npm run check:sync
          npm run check:cloud-ids
          npm run check:android-res
          npm run check:theme-from-image
          npm run check:glass
          npm run check:sounds
          # Nothing load-bearing has been deleted. First, because every check
          # below is meaningless if the thing it checks is gone — and because
          # the question bank in src/data/ is hand-transcribed with no upstream.
          npm run check:repo-intact
          npm run check:agent-docs
          npm run check:payments
          npm run check:native-sound
          npm run check:subject-cards
          npm run check:contrast
          npm run check:anki
          npm run check:textbooks
          npm run check:one-app
          npm run check:flashcard-size
          npm run check:streak
          npm run check:supabase-queue
          npm run check:keyboard
          node scripts/auth-mode-check.mjs
          npm run check:version
          npm run check:preview-parity
          npm run check:native-update
          npm run check:billing
          npm run check:security
          npm run check:attendance
          npm run check:reminder
          npm run check:study-buddy
          npm run check:admin
          npm run check:simulator
          node scripts/simulator-parity-contract-check.mjs
          node scripts/native-clinical-parity-check.mjs
          node scripts/native-clinical-engine-check.mjs
          node scripts/native-ecg12-parity-check.mjs
          npm run check:calendar-columns
          npm run check:note-links

      # The mirror image of the debug workflow's "Build with no ads at all".
      # That one overwrites this file; this one refuses to build if anything
      # has. A release that silently shipped with ads disabled would earn
      # nothing and give no sign of it.
      - name: Confirm this build serves live ads
        run: |
          set -euo pipefail
          if grep -q 'ADS_ENABLED = false' src/lib/adsMode.ts; then
            echo "::error::src/lib/adsMode.ts has ads hard-disabled. A release build must serve live ads."
            exit 1
          fi
          grep -q 'ADS_ENABLED = !__DEV__' src/lib/adsMode.ts \
            || { echo "::error::src/lib/adsMode.ts is not in its shipped form."; exit 1; }
          echo "ads: live (ADS_ENABLED = !__DEV__, and a release bundle sets __DEV__ false)"

      - name: Restore the upload keystore
        # The keystore is stored as base64 in a repository secret. It never
        # exists in the repo, and is written outside the workspace so it cannot
        # be picked up by anything that archives the checkout.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/my-upload-key.jks"

      - name: Build AAB (for Google Play)
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon --no-build-cache --rerun-tasks
        working-directory: mobile/android

      - name: Build APK (for direct install)
        if: ${{ github.event_name == 'push' || inputs.build_apk }}
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --no-build-cache
        working-directory: mobile/android

      - name: Remove the keystore
        # Runners are ephemeral, but do not rely on that.
        if: always()
        run: rm -f "$RUNNER_TEMP/my-upload-key.jks"

      - name: Verify the actual offline question-bank payload
        working-directory: .
        run: |
          python3 scripts/check-neet-pg-artifact.py 'mobile/android/app/build/outputs/apk/**/*.apk' 'mobile/android/app/build/outputs/bundle/**/*.aab'
          python3 scripts/check-university-import-artifact.py 'mobile/android/app/build/outputs/apk/**/*.apk' 'mobile/android/app/build/outputs/bundle/**/*.aab'

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: orbit-mbbs-aab
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload APK
        if: ${{ github.event_name == 'push' || inputs.build_apk }}
        uses: actions/upload-artifact@v4
        with:
          name: orbit-mbbs-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # The version the release NOTES claim has to be the version the AAB
      # carries, and it cannot be typed by hand. It was hardcoded to 14 and
      # stayed 14 through the bump to 15 — so the notes on a correct build told
      # the owner it was the number Play had already rejected. Read it out of
      # the gradle file that the build just used.
      - name: Read the version the build actually carries
        id: appversion
        run: |
          # The job's default working-directory is `mobile` (see `defaults`
          # near the top), so this path is relative to that and NOT to the
          # repo root. Getting it wrong fails the step after a nineteen-minute
          # build has already succeeded, which is the most expensive place in
          # this workflow to be wrong.
          gradle=android/app/build.gradle
          code=$(grep -m1 -oP '^\s*versionCode\s+\K[0-9]+' "$gradle")
          name=$(grep -m1 -oP '^\s*versionName\s+"\K[^"]+' "$gradle")
          if [ -z "$code" ] || [ -z "$name" ]; then
            echo "could not read versionCode/versionName from $gradle" >&2
            exit 1
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Building versionCode $code ($name)"

      # Artifacts need a desktop browser and expire; a release asset can be
      # downloaded from the phone that is going to install it.
      - name: Publish the AAB and APK where a phone can reach them
        if: github.ref_name != 'chatgpt/android-onboarding-release-20261031' && github.ref_name != 'codex/v27-parity-repairs-20261016' && github.ref_name != 'codex/v27-brain-registration-20261016' && github.ref_name != 'codex/v27-context-camera-20261016' && github.ref_name != 'codex/v27-fresh-rebuild-20261016' && github.ref_name != 'codex/v27-mobile-controls-20261016'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Release build ${{ github.run_number }} — v${{ steps.appversion.outputs.code }}
          prerelease: true
          body: |
            Signed release build of the Orbit MBBS native app.

            Main releases require complete 626-target automated Android anatomy evidence. QA-only recovery verifies that application files are unchanged from the installed APK under test. The audit checks UI selection, source rendering, arrows and explicit schematic disclosures; it is not independent clinical certification or a test of every physical device.

            - `app-release.aab` — upload this to Google Play.
            - `app-release.apk` — install this directly to test the real thing.

            Package `com.aistudio.mbbsqbank.aycxvd`, versionCode ${{ steps.appversion.outputs.code }} (${{ steps.appversion.outputs.name }}).
            **Serves live ads**, unlike the debug and preview builds.

            Signed with the upload key whose SHA-1 is
            `CE:EA:8A:41:BB:07:78:C4:78:26:D8:8F:CC:E0:2C:C9:EB:29:40:68`,
            the certificate Play accepted in the upload key reset.

            Built from `${{ github.sha }}`.
          files: |
            mobile/android/app/build/outputs/bundle/release/*.aab
            mobile/android/app/build/outputs/apk/release/*.apk

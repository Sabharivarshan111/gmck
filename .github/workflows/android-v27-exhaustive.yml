name: Android v27 exhaustive verification
on:
  push:
    branches: [codex/v27-parity-repairs-20261016]
  workflow_dispatch:
concurrency:
  group: exhaustive-v27-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  matching-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    outputs:
      run: ${{ steps.apk.outputs.run }}
    steps:
      - id: apk
        uses: actions/github-script@v7
        with:
          script: |
            for(let i=0;i<240;i++){
              const {data}=await github.rest.actions.listWorkflowRuns({...context.repo,workflow_id:'android-debug.yml',branch:context.ref.replace('refs/heads/',''),per_page:20});
              const candidates=data.workflow_runs.filter(r=>r.conclusion!=='cancelled');
              const run=candidates.find(r=>r.head_sha===context.sha)||candidates[0];
              if(run && run.head_sha!==context.sha){
                const {data:diff}=await github.rest.repos.compareCommits({...context.repo,base:run.head_sha,head:context.sha});
                const allowed=new Set(['.github/workflows/android-v27-exhaustive.yml','mobile/scripts/android-webview-exhaustive.mjs','mobile/scripts/android_webview_bootstrap.py','.github/qa/android_attendance.py','.github/qa/android-eye-findings.mjs','.github/qa/android-webview-exhaustive.mjs','.github/qa/android_case_bootstrap.py','.github/qa/run-android-suite.sh']);
                if(diff.status!=='ahead'||!diff.files?.length||diff.files.length>=300||diff.files.some(f=>!allowed.has(f.filename)))throw Error('APK reuse denied: runtime/build/source differs');
              }
              if(run?.status==='completed'){
                if(run.conclusion!=='success')throw Error('Matching debug candidate failed: '+run.conclusion);
                core.setOutput('run',run.id);return;
              }
              await new Promise(r=>setTimeout(r,15000));
            }
            throw Error('No successful exact-source candidate APK');
  webview:
    needs: matching-apk
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        suite: [calendar, pocus, auscultation-case, anatomy-0, auscultation, eye, general, anatomy-controls, native-remaining, anatomy-1, anatomy-2, anatomy-3, anatomy-4, anatomy-5, anatomy-6, anatomy-7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: |
          npm ci --legacy-peer-deps --ignore-scripts
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0
          npx playwright install --with-deps chromium
          python3 -m pip install --quiet --break-system-packages pillow
          mkdir -p artifacts/exhaustive
          node mobile/scripts/native-anatomy-parity-manifest.mjs artifacts/exhaustive/anatomy-coverage.json
      - uses: actions/download-artifact@v4
        with:
          name: orbit-debug-apk
          path: downloaded-apk
          run-id: ${{ needs.matching-apk.outputs.run }}
          github-token: ${{ github.token }}
      - name: Enable acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compare installed Android renderer with live Vercel mobile Chromium
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-boot-timeout: 300
          disable-animations: false
          emulator-options: -no-window -gpu ${{ matrix.suite == 'eye' && 'lavapipe' || 'swiftshader_indirect' }} -memory 3072 -cores 2 -noaudio -no-boot-anim
          script: |
            adb shell wm size 1179x2556
            adb shell wm density 480
            adb install -r downloaded-apk/app-preview.apk
            bash mobile/scripts/build-ui-dump.sh
            ORBIT_UI_HELPER=1 ORBIT_SCREENSHOT_OUT=artifacts/exhaustive bash .github/qa/run-android-suite.sh '${{ matrix.suite }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-android-v27-${{ matrix.suite }}-${{ github.sha }}
          path: artifacts/exhaustive
          retention-days: 14
  # Publishing remains a separate explicit final step after these results and
  # native RN controls are reviewed. Candidate build is an artifact only.

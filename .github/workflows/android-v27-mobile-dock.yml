name: Mobile anatomy dock geometry
on:
  push:
    branches: [codex/v27-mobile-dock-qa-20261016]
permissions:
  contents: read
jobs:
  dock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dd404cb12c85942ce8ded76e1e5f1f4b919e8a51
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix mobile --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - run: npx tsc --noEmit && node scripts/simulator-mobile-ui-check.mjs
      - name: Install browser runner without changing locked application dependencies
        run: |
          npm install --prefix /tmp/orbit-browser --no-audit --no-fund playwright@1.55.0
          ln -s /tmp/orbit-browser/node_modules/playwright node_modules/playwright
          /tmp/orbit-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Build native renderer and exercise phone controls
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          node mobile/scripts/build-local-simulator.mjs
          cat > /tmp/serve-renderer.py <<'PY'
          from http.server import ThreadingHTTPServer, SimpleHTTPRequestHandler
          from pathlib import Path
          root=Path.cwd()
          class Handler(SimpleHTTPRequestHandler):
            def translate_path(self,path):
              name=path.split('?')[0].lstrip('/')
              if not name or name=='simulator': name='index.html'
              built=root/'mobile/android/app/build/generated/simulatorAssets/simulator'/name
              return str(built if built.is_file() else root/'public'/name)
          ThreadingHTTPServer(('127.0.0.1',4180),Handler).serve_forever()
          PY
          python /tmp/serve-renderer.py > /tmp/dock-server.log 2>&1 &
          node scripts/simulator-mobile-dock-e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-dock-geometry
          path: artifacts/mobile-dock

name: Android v27 exact native offline recheck
on:
  push:
    branches: [codex/v27-native-recheck-20261016]
permissions:
  contents: read
  actions: read
jobs:
  remaining:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m pip install --quiet --break-system-packages pillow
          mkdir -p artifacts/native-recheck
      - uses: actions/download-artifact@v4
        with:
          name: orbit-debug-apk
          path: downloaded-apk
          run-id: 38856347087
          github-token: ${{ github.token }}
      - name: Verify the exact candidate APK
        run: echo 'f7960ba2026ae0db858e48dfa680f2ffa2c88151c212caa6242dd5f94c8ff8af  downloaded-apk/app-preview.apk' | sha256sum -c
      - name: Enable acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check native teaching return and offline screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-boot-timeout: 300
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -memory 3072 -cores 2 -noaudio -no-boot-anim
          script: |
            adb shell wm size 1179x2556
            adb shell wm density 480
            adb install -r downloaded-apk/app-preview.apk
            bash mobile/scripts/build-ui-dump.sh
            ORBIT_UI_HELPER=1 ORBIT_SCREENSHOT_OUT=artifacts/native-recheck python3 .github/qa/native_remaining_checks.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-v27-final-offline-${{ github.sha }}
          path: artifacts/native-recheck
          retention-days: 14

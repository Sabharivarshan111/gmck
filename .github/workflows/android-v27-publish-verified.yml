name: Publish verified Android v27 artifacts
on:
  push:
    branches: [codex/v27-publish-verified-20261016]
permissions:
  contents: write
  actions: write
concurrency:
  group: verified-publication-v27-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Cancel only the superseded publication waiter
        uses: actions/github-script@v7
        with:
          script: |
            const config=JSON.parse(require('fs').readFileSync('.github/qa/v27-publication.json','utf8'));
            if(config.supersededPublicationRun&&config.supersededPublicationRun!==context.runId){
              const {data:old}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:config.supersededPublicationRun});
              if(old.path!=='.github/workflows/android-v27-publish-verified.yml'||old.head_branch!=='codex/v27-publish-verified-20261016')throw Error('Refusing to cancel an unrelated workflow');
              if(old.status!=='completed')await github.rest.actions.cancelWorkflowRun({...context.repo,run_id:old.id});
            }
      - name: Require successful exact-source builds and all device suites
        id: qualify
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const config=JSON.parse(fs.readFileSync('.github/qa/v27-publication.json','utf8'));
            if(config.visualReviewBlocker)throw Error('Visual review blocks publication: '+config.visualReviewBlocker);
            const allowed=new Set(['.github/qa/native_remaining_checks.py','.github/workflows/android-v27-native-recheck.yml','.github/qa/android-eye-findings.mjs','.github/qa/android-webview-exhaustive.mjs','.github/workflows/android-v27-exhaustive.yml','.github/workflows/android-v27-ausc-capture.yml','.github/workflows/android-v27-eye-capture.yml','.github/workflows/android-internal.yml','.github/workflows/android-v27-anatomy1-audit.yml','.github/workflows/android-v27-anatomy3-audit.yml','.github/qa/reference-page-errors.mjs','.github/workflows/android-v27-anatomy-partitions.yml']);
            const workflowPaths={debug:'.github/workflows/android-debug.yml',internal:'.github/workflows/android-internal.yml',release:'.github/workflows/android-release.yml',qa:'.github/workflows/android-v27-exhaustive.yml',motion:'.github/workflows/android-v27-ausc-capture.yml',eye:'.github/workflows/android-v27-eye-capture.yml',native:'.github/workflows/android-v27-native-recheck.yml',anatomy1:'.github/workflows/android-v27-anatomy1-audit.yml',anatomy3:'.github/workflows/android-v27-anatomy3-audit.yml',partitions:'.github/workflows/android-v27-anatomy-partitions.yml',brain:'.github/workflows/android-v27-brain-canonical.yml',preview:'.github/workflows/android-v27-brain-preview.yml',ux:'.github/workflows/simulator-mobile-ux-smoke.yml'};
            let runs;
            for(let attempt=0;attempt<300;attempt++){
              runs={};for(const key of Object.keys(workflowPaths)){const {data}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:config[key]});runs[key]=data;}
              for(const [key,run] of Object.entries(runs))if(key!=='qa'&&run.status==='completed'&&run.conclusion!=='success')throw Error(key+' check failed; publication remains blocked');
              if(Object.values(runs).every(r=>r.status==='completed'))break;
              if(attempt===299)throw Error('Verification is still incomplete after five hours; publication remains blocked');
              await new Promise(r=>setTimeout(r,60000));
            }
            for(const [key,expectedPath] of Object.entries(workflowPaths)){
              const run=runs[key];if(run.path!==expectedPath)throw Error(key+' is the wrong workflow');
              if(key==='qa'){if(!['success','failure'].includes(run.conclusion))throw Error('Baseline verification was cancelled or incomplete');}
              else if(run.conclusion!=='success')throw Error(key+' workflow did not pass');
              if(config.expectedHeads[key]&&run.head_sha!==config.expectedHeads[key])throw Error(key+' source head differs');
              const base=['debug','internal','release','brain','preview','ux'].includes(key)?config.source:config.baselineSource;
              if(run.head_sha!==base){
                const {data:diff}=await github.rest.repos.compareCommits({...context.repo,base,head:run.head_sha});
                if(diff.status!=='ahead'||!diff.files?.length||diff.files.length>=300||diff.files.some(f=>!(key==='preview'?f.filename==='.github/workflows/android-v27-brain-preview.yml':key==='brain'?f.filename==='.github/workflows/android-v27-brain-canonical.yml':allowed.has(f.filename))))throw Error(key+' source differs from the qualified runtime');
              }
              core.setOutput(key,run.id);
            }
            const {data:delta}=await github.rest.repos.compareCommits({...context.repo,base:config.baselineSource,head:config.source});
            if(delta.status!=='ahead'||!delta.files||JSON.stringify(delta.files.map(f=>f.filename).sort())!==JSON.stringify([...config.reviewedDeltaFiles].sort()))throw Error('Reviewed source delta differs');
            const jobs={};for(const key of ['qa','motion','eye','native','anatomy1','anatomy3','partitions','brain','preview','ux']){const {data}=await github.rest.actions.listJobsForWorkflowRun({...context.repo,run_id:config[key],per_page:100});jobs[key]=data.jobs;}
            const baseline=['calendar','pocus','eye','general','anatomy-controls',...Array.from({length:8},(_,i)=>'anatomy-'+i).filter(s=>!['anatomy-1','anatomy-2','anatomy-3','anatomy-4'].includes(s))];
            for(const suite of baseline){const job=jobs.qa.find(j=>j.name==='webview ('+suite+')');if(job?.conclusion!=='success')throw Error('Required baseline suite failed or missing: '+suite);}
            for(const suite of ['auscultation','auscultation-case']){const job=jobs.motion.find(j=>j.name==='webview ('+suite+')');if(job?.conclusion!=='success')throw Error('Required compositor-qualified suite failed or missing: '+suite);}
            if(jobs.anatomy1.find(j=>j.name==='webview (anatomy-1)')?.conclusion!=='success')throw Error('Full anatomy group 1 error-attributed recheck did not pass');
            if(jobs.anatomy3.find(j=>j.name==='webview (anatomy-3)')?.conclusion!=='success')throw Error('Full anatomy group 3 error-attributed recheck did not pass');
            for(const group of [2,4])for(const part of [0,1,2])if(jobs.partitions.find(j=>j.name==='webview (anatomy-'+group+', '+part+')')?.conclusion!=='success')throw Error('Required anatomy partition did not pass: '+group+'/'+part);
            if(jobs.eye.find(j=>j.name==='webview (eye)')?.conclusion!=='success')throw Error('Matched eye capture did not pass');
            if(jobs.native.find(j=>j.name==='remaining')?.conclusion!=='success')throw Error('Full native offline recheck did not pass');
            for(const k of ['brain','preview'])if(jobs[k].find(j=>j.name==='webview (brain-registration)')?.conclusion!=='success')throw Error('Rebuilt registration verification failed: '+k);
            for(const name of ['production-mobile-ux','vault-layout'])if(jobs.ux.find(j=>j.name===name)?.conclusion!=='success')throw Error('Rebuilt UI check failed: '+name);
            fs.mkdirSync('release-assets',{recursive:true});
            fs.writeFileSync('release-assets/verification-scope.json',JSON.stringify({source:config.source,baselineSource:config.baselineSource,carryForward:'Old-runtime exhaustive suites are retained for unchanged simulator branches. All26 Z-Anatomy selections were rerun on the rebuilt APK against corrected canonical source and the exact Vercel preview. This is not a claim that every old suite ran on the new APK.',reviewedDeltaFiles:config.reviewedDeltaFiles,runs:Object.fromEntries(Object.entries(runs).map(([k,r])=>[k,{id:r.id,sha:r.head_sha,conclusion:r.conclusion,url:r.html_url}])),requiredBaselineSuites:baseline,requiredReplacementSuites:['auscultation','auscultation-case'],additionalMatchedEyeCapture:true,requiredNativeOfflineRecheck:true,requiredAnatomyGroup1Recheck:true,requiredAnatomyGroup3Recheck:true,requiredLongGroupPartitions:{groups:[2,4],parts:[0,1,2]},jobs},null,2));
            core.setOutput('source',config.source);
      - uses: actions/download-artifact@v4
        with:
          name: orbit-debug-apk
          path: build/debug
          run-id: ${{ steps.qualify.outputs.debug }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: orbit-internal-apk
          path: build/internal
          run-id: ${{ steps.qualify.outputs.internal }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: orbit-mbbs-apk
          path: build/release
          run-id: ${{ steps.qualify.outputs.release }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: orbit-mbbs-aab
          path: build/aab
          run-id: ${{ steps.qualify.outputs.release }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          path: evidence/baseline
          run-id: ${{ steps.qualify.outputs.qa }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          path: evidence/auscultation-compositor
          run-id: ${{ steps.qualify.outputs.motion }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          path: evidence/matched-eye
          run-id: ${{ steps.qualify.outputs.eye }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          path: evidence/native-offline-recheck
          run-id: ${{ steps.qualify.outputs.native }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          path: evidence/anatomy-group1-error-audit
          run-id: ${{ steps.qualify.outputs.anatomy1 }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          path: evidence/anatomy-group3-error-audit
          run-id: ${{ steps.qualify.outputs.anatomy3 }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          path: evidence/anatomy-partitions
          run-id: ${{ steps.qualify.outputs.partitions }}
          github-token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          path: evidence/rebuilt-brain-canonical
          run-id: ${{ steps.qualify.outputs.brain }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          path: evidence/rebuilt-brain-vercel
          run-id: ${{ steps.qualify.outputs.preview }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          path: evidence/rebuilt-ux
          run-id: ${{ steps.qualify.outputs.ux }}
          github-token: ${{ github.token }}
      - name: Verify rebuilt reference coverage and artifact integrity
        run: |
          node --experimental-strip-types .github/qa/verify-brain-registration.mjs
          python3 .github/qa/verify-release-integrity.py
      - name: Verify complete partition coverage and screenshot pairs
        run: node .github/qa/verify-anatomy-partitions.mjs evidence/anatomy-partitions release-assets/anatomy-partition-coverage.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify APK signatures, package identifiers and AAB signature
        shell: bash
        run: |
          set -euo pipefail
          sigtool=$(find "${ANDROID_HOME:?}/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -1)
          aapt=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name aapt | sort -V | tail -1)
          test -x "$sigtool"
          test -x "$aapt"
          for apk in build/debug/app-preview.apk build/internal/app-internal.apk build/release/app-release.apk; do
            "$sigtool" verify --verbose --print-certs "$apk" > "/tmp/$(basename "$apk").signing.txt"
            cat "/tmp/$(basename "$apk").signing.txt"
            grep -qi 'certificate SHA-1 digest: ceea8a41bb0778c47826d88fcce02cc9eb294068' "/tmp/$(basename "$apk").signing.txt"
            "$aapt" dump badging "$apk" > "/tmp/$(basename "$apk").package.txt"
            grep -q "versionCode='27'" "/tmp/$(basename "$apk").package.txt"
            if [[ "$apk" == build/debug/* ]]; then expected=com.aistudio.mbbsqbank.aycxvd.debug; else expected=com.aistudio.mbbsqbank.aycxvd; fi
            grep -q "package: name='$expected'" "/tmp/$(basename "$apk").package.txt"
          done
          jarsigner -verify build/aab/app-release.aab > /tmp/aab-signature.txt 2>&1
          cat /tmp/aab-signature.txt
          grep -q 'jar verified' /tmp/aab-signature.txt
          mkdir -p evidence/build-signatures
          cp /tmp/*.signing.txt /tmp/*.package.txt /tmp/aab-signature.txt evidence/build-signatures/
      - name: Package exact checked artifacts
        run: |
          mkdir -p release-assets
          cp build/debug/app-preview.apk release-assets/app-debug.apk
          cp build/internal/app-internal.apk release-assets/app-internal.apk
          cp build/release/app-release.apk release-assets/app-release.apk
          cp build/aab/app-release.aab release-assets/app-release.aab
          cp release-assets/build-integrity.json release-assets/rebuilt-reference-coverage.json evidence/
          cp release-assets/verification-scope.json evidence/verification-scope.json
          zip -qr release-assets/orbit-v27-android-verification.zip evidence
          cd release-assets
          sha256sum *.apk *.aab *.zip *.json > SHA256SUMS.txt
      - name: Publish the verified APKs, AAB and evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.qualify.outputs.source }}
        run: |
          cat > /tmp/release-notes.md <<'NOTES'
          Android v27 simulator and calendar repairs, with sixteen required installed Android emulator suite scopes passed across qualified runs and partitioned jobs, plus synchronized eye captures. Includes a corrected brain-reference camera with three explicitly disclosed malformed source meshes omitted, coronary heart context by default, visible calendar Add validation, POCUS drawing continuity and frame-rate-independent native ICU sampling.

          - app-debug.apk: separate .debug package, ads disabled.
          - app-internal.apk: production package and upload key, ads disabled.
          - app-release.apk: signed production package, live ads enabled.
          - app-release.aab: signed bundle for Google Play.
          - orbit-v27-android-verification.zip: device screenshots, mobile Vercel references and check reports.
          - verification-scope.json: exact source/build provenance and required suite results.

          Builds are from e7cafadc843ac353dc45dc9b139a445c7d5e4f08. Earlier exhaustive suites qualify the prior runtime97ee4579b4b2a6230c06f7616b7486c5be4f51d4 for unchanged branches. All26 Z-Anatomy selections were rerun on this rebuilt APK against corrected canonical source and its exact Vercel preview. See verification-scope.json for this scoped carry-forward; every old suite was not rerun on the new APK. The source-registration gap omits right orbital inferior frontal gyrus, corpus callosum and hippocampal commissure; replacement anatomy was not invented.

          The baseline anatomy groups 1 and 3 completed its organ/connection interactions but failed the final uncaught-error check with an unattributed `int64` message. Their complete replacement suites passed with source-page and stack attribution enabled; no error filter or assertion relaxation was used. The original failures remain in the baseline evidence. Groups 2 and 4 exceeded the original runner time limits; their six smaller replacement jobs passed, and a separate coverage check confirms every assigned connection and overview appears exactly once with its required screenshots.

          The initial case-auscultation paused-image comparison was rerun using screen-bounded compositor crops; both normal and selected-case replacement suites passed. Baseline failures remain visible in the evidence and are explicitly replaced by the qualified reruns. Eye captures additionally synchronize instrument, gaze and framing. The complete native offline flow was rerun with exact MRI-count scrolling after the earlier script stopped at an offscreen label.

          Studio, cases, ICU, ECG, radiology and clubbing use native RN screens. Anatomy and advanced bedside tools use the locally bundled canonical WebGL renderer; geometry downloads into a checksum-pinned private cache on first use. Comparisons use an Android 35 emulator and live Vercel mobile Chromium. Physical-phone speaker playback and universal pixel-identical behavior are not certified.
          NOTES
          gh release create v27-verified-20261016 release-assets/* --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title 'ORBIT v27 — verified Android simulator repairs' --notes-file /tmp/release-notes.md --prerelease

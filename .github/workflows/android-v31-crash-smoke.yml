name: Android v32 native launch and Google tap

# Verify the exact signed APK built from the main head captured at job start.
# Tests exact CTA and handles only the observed CI Pixel Launcher overlay;
# TypeScript, lint, and Gradle compilation cannot verify.
on:
  push:
    branches: [main, fix/android-v32-native-smoke-20261105]
    paths: ['.github/workflows/android-v31-crash-smoke.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-crash-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the exact signed release APK from current main
        id: corrected_release
        uses: actions/github-script@v7
        with:
          script: |
            const { data: branch } = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            const expectedSha = branch.commit.sha;
            for (let attempt = 0; attempt < 300; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...context.repo, workflow_id: 'android-release.yml', branch: 'main', per_page: 20,
              });
              const run = data.workflow_runs.find(run => run.head_sha === expectedSha);
              if (run?.status === 'completed') {
                if (run.conclusion !== 'success') throw new Error('Signed main release failed: ' + run.conclusion);
                core.setOutput('run_id', String(run.id));
                core.setOutput('sha', expectedSha);
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('Signed main build did not finish within test wait window');
      - name: Download exact main-branch v32 release APK
        uses: actions/download-artifact@v4
        with:
          name: orbit-mbbs-apk
          path: downloaded-apk
          run-id: ${{ steps.corrected_release.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch production APK and attempt first Google tap on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-boot-timeout: 360
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            mkdir -p artifacts/v31-crash-smoke
            adb shell wm size 1080x2400
            adb shell wm density 440
            adb install -r downloaded-apk/app-release.apk
            adb shell am force-stop com.aistudio.mbbsqbank.aycxvd
            adb logcat -c
            adb shell am start -n com.aistudio.mbbsqbank.aycxvd/.MainActivity
            sleep 15
            set -eu
            # Label the actual SHA-matched APK, then execute the helper.
            env APK_PROVENANCE="main build ${{ steps.corrected_release.outputs.run_id }} SHA ${{ steps.corrected_release.outputs.sha }}" python3 mobile/scripts/android_v31_crash_smoke.py
            grep -q 'Google CTA tap dispatched: True' artifacts/v31-crash-smoke/result.txt
      - name: Upload Android crash evidence and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-v31-android-native-crash-smoke
          path: artifacts/v31-crash-smoke/
          if-no-files-found: warn
          retention-days: 7

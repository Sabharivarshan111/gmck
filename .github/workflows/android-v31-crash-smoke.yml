name: Android v32 native launch and Google tap

# Run on the exact main-branch signed v32 APK from build 1032.
# This tests actual Android launch and a Google sign-in button press, which
# TypeScript, lint, and Gradle compilation cannot verify.
on:
  push:
    branches: [fix/android-v32-native-smoke-20261105]
    paths: ['.github/workflows/android-v31-crash-smoke.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-crash-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Wait for main-branch signed v32 release APK (build 1032)
        id: corrected_release
        uses: actions/github-script@v7
        with:
          script: |
            const runId = 42018368540;
            for (let attempt = 0; attempt < 240; attempt++) {
              const { data: run } = await github.rest.actions.getWorkflowRun({
                ...context.repo, run_id: runId,
              });
              if (run.status === 'completed') {
                if (run.conclusion !== 'success') {
                  throw new Error('Corrected v31 release build did not succeed: ' + run.conclusion);
                }
                if (run.head_sha !== 'b4a498cc5b826b1d331c0f649b7f0444c925cbb7') {
                  throw new Error('APK source mismatch, refusing to test stale code: ' + run.head_sha);
                }
                core.setOutput('run_id', String(runId));
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('Corrected Android build did not finish within workflow wait window');
      - name: Download exact main-branch v32 release APK
        uses: actions/download-artifact@v4
        with:
          name: orbit-mbbs-apk
          path: downloaded-apk
          run-id: ${{ steps.corrected_release.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch production APK and attempt first Google tap on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-boot-timeout: 360
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            mkdir -p artifacts/v31-crash-smoke
            adb shell wm size 1080x2400
            adb shell wm density 440
            adb install -r downloaded-apk/app-release.apk
            adb shell am force-stop com.aistudio.mbbsqbank.aycxvd
            adb logcat -c
            adb shell am start -n com.aistudio.mbbsqbank.aycxvd/.MainActivity
            sleep 15
            set -eu
            # Label the actual SHA-matched APK, then execute the helper.
            sed -i 's/release-1028 SHA 6052733eefeb98d7de112939f9f2b9f4341c723e/release-1032 SHA b4a498cc5b826b1d331c0f649b7f0444c925cbb7/' mobile/scripts/android_v31_crash_smoke.py
            python3 mobile/scripts/android_v31_crash_smoke.py
            grep -q 'Google CTA tap dispatched: True' artifacts/v31-crash-smoke/result.txt
      - name: Upload Android crash evidence and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-v31-android-native-crash-smoke
          path: artifacts/v31-crash-smoke/
          if-no-files-found: warn
          retention-days: 7

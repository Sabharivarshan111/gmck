name: Android v35 post-Google Continue rendering and entry smoke

on:
  push:
    branches: [qa/android-v35-continue-emulator-20261106]
    paths:
      - '.github/workflows/android-v35-continue-emulator.yml'
      - 'mobile/scripts/v35_post_auth_emulator.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  post-auth-continue:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Locate exact source-matched debug APK with Google already bypassed
        id: debug
        uses: actions/github-script@v7
        with:
          script: |
            const sha = 'b86cccb70c78405847068ae78e6cc046ae621a4b';
            for (let attempt = 0; attempt < 240; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...context.repo, workflow_id: 'android-debug.yml', branch: 'main', per_page: 15
              });
              const run = data.workflow_runs.find(item => item.head_sha === sha);
              if (run?.status === 'completed') {
                if (run.conclusion !== 'success') throw new Error('Source-matched debug APK failed: ' + run.conclusion);
                core.setOutput('run_id', String(run.id));
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('Source-matched debug APK did not complete');
      - name: Download v35 source-matched debug APK
        uses: actions/download-artifact@v4
        with:
          name: orbit-debug-apk
          path: downloaded-apk
          run-id: ${{ steps.debug.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Prepare screenshot analysis
        run: python3 -m pip install --user pillow
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 native emulator - verify visible CTA, validate click and complete setup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-boot-timeout: 360
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -eu
            mkdir -p artifacts/v35-post-google
            adb shell wm size 1080x2400
            adb shell wm density 440
            find downloaded-apk -name '*.apk' -print -exec adb install -r {} \;
            adb shell am force-stop com.aistudio.mbbsqbank.aycxvd.debug || true
            adb shell monkey -p com.aistudio.mbbsqbank.aycxvd.debug -c android.intent.category.LAUNCHER 1
            sleep 12
            python3 mobile/scripts/v35_post_auth_emulator.py
      - name: Upload screenshots, UI trees and validation evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbit-v35-post-google-continue-emulator
          path: artifacts/v35-post-google/
          if-no-files-found: warn
          retention-days: 14

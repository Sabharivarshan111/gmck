name: Build Z-Anatomy peripheral nerves

on:
  push:
    branches: [main]
    paths:
      - "scripts/export-zanatomy-peripheral-nerves.py"
      - ".github/workflows/build-peripheral-nerves.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-nerves:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender python3-numpy

      - name: Download official Z-Anatomy nervous system source
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3             "https://raw.githubusercontent.com/LluisV/Z-Anatomy/PC-Version/Resources/Models/FBX/NervousSystem100.fbx"             -o /tmp/NervousSystem100.fbx
          test "$(stat -c%s /tmp/NervousSystem100.fbx)" -gt 50000000

      - name: Export mobile peripheral nerve supplement
        run: |
          rm -f public/models/zanatomy_peripheral_nerves.glb public/models/zanatomy_peripheral_nerves.manifest.json
          blender -b             --python scripts/export-zanatomy-peripheral-nerves.py --             --src /tmp/NervousSystem100.fbx             --out public/models/zanatomy_peripheral_nerves.glb             --manifest public/models/zanatomy_peripheral_nerves.manifest.json
          test -s public/models/zanatomy_peripheral_nerves.glb
          test -s public/models/zanatomy_peripheral_nerves.manifest.json

      - name: Verify essential nerve coverage and size
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'public/models/zanatomy_peripheral_nerves.manifest.json';
          const m = JSON.parse(fs.readFileSync(p, 'utf8'));
          const required = [
            'vagus_nerve','brachial_plexus','median_nerve','ulnar_nerve',
            'radial_nerve','musculocutaneous_nerve','axillary_nerve',
            'intercostal_nerves','sympathetic_chain','sciatic_nerve',
            'femoral_nerve','obturator_nerve','tibial_nerve','common_fibular_nerve'
          ];
          const missing = required.filter(k => !m.targets[k] || m.targets[k].length === 0);
          if (missing.length) throw new Error('Missing required Z-Anatomy nerves: ' + missing.join(', '));

          // The official NervousSystem100.fbx currently has no named phrenic
          // or splanchnic mesh. Keep these explicit source gaps so nobody
          // "fixes" the test by mapping unrelated anatomy to those names.
          const knownSourceGaps = ['phrenic_nerve', 'splanchnic_nerves'];
          for (const key of knownSourceGaps) {
            if (!Array.isArray(m.targets[key])) throw new Error('Manifest lost known source gap: ' + key);
            if (m.targets[key].length !== 0) {
              console.log('Upstream now contains', key, '— review and remove it from knownSourceGaps after visual QA.');
            }
          }
          if (m.exportedTriangles > 400000) throw new Error('400k total triangle budget exceeded: ' + m.exportedTriangles);
          const bytes = fs.statSync('public/models/zanatomy_peripheral_nerves.glb').size;
          if (bytes > 9 * 1024 * 1024) throw new Error('9 MiB on-demand mobile asset budget exceeded: ' + bytes);
          console.log('Required Z-Anatomy nerves found:', required.map(k => k + '=' + m.targets[k].length).join(', '));
          console.log('Known source gaps:', knownSourceGaps.join(', '));
          console.log('Peripheral nerve layer:', m.exportedObjectCount, 'objects,', m.exportedTriangles, 'triangles,', (bytes/1048576).toFixed(2), 'MiB');
          NODE

      - name: Commit generated nerve asset
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Blender takes long enough that main often advances during export.
          # Preserve the generated files, replay them onto the latest main, and
          # retry a rejected push rather than rebasing a binary GLB/JSON commit
          # and creating an unresolvable content conflict.
          generated_dir="$(mktemp -d)"
          cp public/models/zanatomy_peripheral_nerves.glb "$generated_dir/nerve.glb"
          cp public/models/zanatomy_peripheral_nerves.manifest.json "$generated_dir/nerve.manifest.json"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$generated_dir/nerve.glb" public/models/zanatomy_peripheral_nerves.glb
            cp "$generated_dir/nerve.manifest.json" public/models/zanatomy_peripheral_nerves.manifest.json
            git add public/models/zanatomy_peripheral_nerves.glb public/models/zanatomy_peripheral_nerves.manifest.json

            if git diff --cached --quiet; then
              echo "No generated asset changes"
              exit 0
            fi

            git commit -m "Add mobile Z-Anatomy peripheral nerve layer"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Main advanced during push; retrying generated files on latest main (attempt $attempt/3)"
          done

          echo "Could not publish generated nerve asset after 3 attempts"
          exit 1

name: Exam sign images

# Fetch a photograph for each general-examination sign.
#
# Every case sheet in this app opens with the same line — "Pallor, Icterus,
# Cyanosis, Clubbing, Koilonychia, Lymphadenopathy, Edema" — and that part of
# clerking cannot be taught in words. Nobody has learned what koilonychia looks
# like by reading "spoon-shaped nails". The app's owner asked for photographs
# rather than drawings for exactly that reason, and a drawing would be the
# wrong answer here even though it is the right answer for the anatomy plates:
# a clinical sign has to be RECOGNISED against a real hand in an exam hall.
#
# This runs on a runner rather than in an agent sandbox because the egress
# gateway blocks commons.wikimedia.org outright, the same way it blocks the
# Supabase project host. The agent decides WHICH picture each sign needs — that
# is `search` in mobile/src/lib/generalExamSigns.ts — and the runner fetches it.
# The uploader in supabase-tasks.yml then puts whatever lands in
# public/diagrams/ into the bucket, so the two halves stay separate.
#
# ── The licence rule ───────────────────────────────────────────────────────
#
# This app ships on Play under a real developer account, and a clinical
# photograph is usually of a real patient and usually somebody's copyrighted
# work. So ONLY public domain or a Creative Commons licence permitting
# commercial use is taken. Everything else is refused, and a sign whose search
# finds nothing acceptable simply keeps no picture — the app already renders
# that case as text alone. A missing picture is the correct outcome; a picture
# with no licence is a takedown and possibly an account.
#
# Attribution is written to a manifest and shown under the picture in the app.
# A CC-BY attribution that nobody displays is a licence nobody is keeping.

on:
  # Deliberate only. It used to run on every push that touched the sign list,
  # and that is wrong now that a fetched picture is a CANDIDATE awaiting review
  # rather than something the app displays: each run picked a new wrong
  # photograph for pallor and committed it, so deleting one just brought
  # another. Fetching is a step somebody takes when they are ready to sit and
  # look at what comes back.
  workflow_dispatch:
    inputs:
      only:
        description: 'Sign id(s), comma separated (blank = every sign with no picture yet)'
        required: false
        default: ''
      probe:
        description: 'Show what every source offers for `only`, and commit NOTHING'
        required: false
        default: 'false'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch a freely-licensed photograph for each sign
        env:
          ONLY: ${{ github.event.inputs.only }}
          PROBE: ${{ github.event.inputs.probe }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re, sys, urllib.parse, urllib.request

          API = 'https://commons.wikimedia.org/w/api.php'
          # Commons asks for a real User-Agent naming the tool and a contact.
          UA = 'OrbitMBBS-exam-signs/1.0 (https://github.com/Sabharivarshan111/gmck)'

          OUT = pathlib.Path('public/diagrams/signs')
          OUT.mkdir(parents=True, exist_ok=True)
          MANIFEST = pathlib.Path('mobile/src/lib/examSignImages.ts')
          HEADER = MANIFEST.read_text().split('export const SIGN_IMAGES')[0]

          # Commercial use must be permitted. This is the whole gate.
          OK_LICENCES = re.compile(
              r'^(cc0|cc-zero|public domain|pd-|cc-by-(sa-)?[234](\.\d)?|cc by(-sa)? [234])',
              re.I)
          # Explicitly refused even though they look Creative Commons.
          BAD = re.compile(r'(nc|non-?commercial|nd|no-?deriv|fair use|non-free)', re.I)

          # ── Why every search says "filetype:bitmap" ────────────────────
          #
          # It did not, and that single omission is why seven signs had no
          # picture. Namespace 6 is *files*, not images, and Commons is full of
          # Internet Archive scans of 19th-century medical textbooks — which
          # are files, in namespace 6, whose OCR'd text mentions every clinical
          # word there is. So "palmar erythema liver" returned eight PDFs and
          # no photograph, "moon facies cushing" returned a 1657 polyglot bible
          # and a 1914 Billboard, and the twelve-result window was full before
          # a single photograph could compete.
          #
          # The MIME check below then refused them all, correctly, and the sign
          # was recorded as having nothing available. That conclusion was
          # wrong: File:Palmar erythema.jpg exists, is CC BY-SA 3.0, and is
          # already used by this app through curatedExamPhotos.ts. It simply
          # never appeared in its own search.
          #
          # `filetype:bitmap` is a CirrusSearch keyword that restricts to
          # raster images. It narrows the corpus; it does not weaken the title
          # gate or the licence gate, both of which still run on whatever comes
          # back. Nothing that was refused before is accepted now — the change
          # is only that photographs are in the window at all.
          IMAGES_ONLY = 'filetype:bitmap'

          # ── And why the queries are built from the title gate ──────────
          #
          # Adding filetype:bitmap alone was not enough, and the run that
          # proved it is worth keeping. With the books gone, most searches
          # returned "no files at all" — including "palmar erythema liver",
          # for a sign whose picture File:Palmar erythema.jpg demonstrably
          # exists and is CC BY-SA 3.0.
          #
          # The reason is that a CirrusSearch query is an AND over full text.
          # "palmar erythema liver" demands all three words somewhere on the
          # file page, and that page says nothing about the liver. Three
          # descriptive words is a narrower query than any single photograph
          # can satisfy, so the terms were fighting each other.
          #
          # `titleMustContain` already names exactly what has to be in the
          # title, and `intitle:` searches that directly. So the first pass
          # asks for what the gate is going to demand anyway — which means the
          # search and the gate can no longer disagree, and a hit that comes
          # back is one the gate will accept. The free-text terms stay as a
          # second pass for the signs whose word is common enough to need
          # them.
          def queries(terms, gate):
              for word in gate:
                  yield f'intitle:"{word}" {IMAGES_ONLY}'
              for term in terms:
                  yield f'{term} {IMAGES_ONLY}'

          # ── A clinical sign needs a PHOTOGRAPH of a patient ────────────
          #
          # `intitle:` found files at last, and four of the seven it found were
          # unusable in a way the title could never have revealed:
          #
          #   pallor  -> "P 451 Harper's vol121--Face assumed a deadly pallor"
          #              a magazine illustration of two men at a table, from a
          #              novel. The words are perfect. It is a drawing.
          #   build   -> "Ancient Egyptian Medicine-starvation-cachexia"
          #              a carved stone relief.
          #   facies  -> a grainy archive snapshot of a woman outdoors; even if
          #              the subject had myxoedema, nobody could learn the
          #              facies from it.
          #
          # A student cannot tell a wrong picture from a right one — that is
          # why they are looking at it — so a Victorian engraving captioned
          # with the right word is worse than a blank.
          #
          # Commons categories are the signal a title does not carry: artwork
          # is categorised as artwork. This refuses anything whose categories
          # or title say drawing, engraving, relief, painting or book plate.
          # It cannot catch everything, which is why the human-reviewed list in
          # curatedExamPhotos.ts exists and why new fetches get looked at.
          NOT_A_PHOTOGRAPH = re.compile(
              r'(illustration|drawing|engraving|etching|woodcut|lithograph|'
              r'painting|artwork|relief|sculpture|statue|frieze|papyrus|'
              r'manuscript|book plate|bookplate|comic|cartoon|caricature|'
              r'diagram|clip ?art|icon|logo|harper|ancient|antiquit)', re.I)

          # ── Commons is not the only place with free pictures ──────────
          #
          # Everything above searches ONE source, and that was a real limit
          # rather than a safe default: Commons is a volunteer media library,
          # not a clinical image bank, so for several signs it genuinely has
          # nothing — and the fetcher reported "nothing acceptable exists"
          # when what it meant was "nothing acceptable is HERE".
          #
          # Two more sources, both of which permit commercial use by
          # construction, so nothing about the licence rule is relaxed:
          #
          #   Openverse  — the Creative Commons search index (Flickr, museums,
          #                science archives, Commons itself). Its API filters
          #                to commercially-usable licences server-side.
          #   Categories — Commons CATEGORY membership rather than full text.
          #                A person put the file in "Category:Anemia"; the
          #                OCR'd text of a 1902 textbook did not. This is a
          #                different and far better signal than a word search,
          #                and it is the one thing that would have kept a
          #                wrestler out of the results.
          #
          # What does NOT change: every candidate still has to be looked at by
          # a human before the app will display it. More sources means more
          # candidates worth looking at, not fewer eyes.
          OPENVERSE = 'https://api.openverse.org/v1/images/'
          # cc0 and the public-domain mark carry no conditions; by and by-sa
          # require attribution, which the app shows. Everything else — nc in
          # any form, nd in any form — is refused here as it is everywhere.
          OPENVERSE_OK = {'cc0', 'pdm', 'by', 'by-sa'}

          def openverse(term, limit=20):
              url = OPENVERSE + '?' + urllib.parse.urlencode({
                  'q': term,
                  'license_type': 'commercial',
                  'page_size': str(limit),
              })
              req = urllib.request.Request(url, headers={'User-Agent': UA})
              with urllib.request.urlopen(req, timeout=45) as r:
                  data = json.load(r)
              out = []
              for hit in data.get('results', []):
                  lic = (hit.get('license') or '').lower()
                  if lic not in OPENVERSE_OK:
                      continue
                  src = hit.get('url')
                  if not src:
                      continue
                  out.append({
                      'title': hit.get('title') or src.rsplit('/', 1)[-1],
                      'url': src,
                      'licence': f"CC {lic.upper()} {hit.get('license_version') or ''}".strip(),
                      'credit': hit.get('creator') or hit.get('source') or 'Openverse',
                      'source': hit.get('foreign_landing_url') or src,
                  })
              return out

          # ── Open-i: PMC open-access clinical photographs ───────────────
          #
          # The source that should have been first. Commons is a volunteer
          # media library and Openverse indexes Flickr and museums; neither is
          # where clinical photographs live. Open-i is the US National Library
          # of Medicine's image index over PubMed Central's OPEN ACCESS subset
          # — case reports and journal figures — and it can filter to
          # PHOTOGRAPHS specifically (`it=ph`), which no other source here can.
          #
          # Licences in the PMC OA subset vary per article, so the filter below
          # is not optional: CC BY and CC0 are taken, everything carrying nc or
          # nd is refused exactly as everywhere else. Open-i states the licence
          # per result, and the article URL is kept for attribution.
          OPENI = 'https://openi.nlm.nih.gov/api/search'
          OPENI_BAD = re.compile(r'(\bnc\b|non-?commercial|\bnd\b|no-?deriv)', re.I)
          OPENI_OK = re.compile(r'(cc0|public domain|creative commons attribution|cc.?by)', re.I)

          def openi(term, limit=25):
              url = OPENI + '?' + urllib.parse.urlencode({
                  'query': term,
                  'it': 'ph',      # photographs only — not charts, not graphs
                  'coll': 'pmc',   # the open-access subset
                  'm': '1',
                  'n': str(limit),
              })
              req = urllib.request.Request(url, headers={'User-Agent': UA})
              with urllib.request.urlopen(req, timeout=60) as r:
                  data = json.load(r)
              out = []
              for hit in data.get('list', []):
                  lic = (hit.get('license') or hit.get('licenseType') or '')
                  if OPENI_BAD.search(lic) or not OPENI_OK.search(lic):
                      continue
                  img = hit.get('imgLarge') or hit.get('imgGrid150')
                  if not img:
                      continue
                  if img.startswith('/'):
                      img = 'https://openi.nlm.nih.gov' + img
                  out.append({
                      'title': (hit.get('image', {}) or {}).get('caption')
                               or hit.get('title') or term,
                      'url': img,
                      'licence': lic.strip(),
                      'credit': hit.get('journal_title') or 'PubMed Central (open access)',
                      'source': hit.get('pmcid')
                                and f"https://www.ncbi.nlm.nih.gov/pmc/articles/{hit['pmcid']}/"
                                or hit.get('detailedQueryURL') or img,
                  })
              return out

          def api(**params):
              params.setdefault('format', 'json')
              params.setdefault('action', 'query')
              url = API + '?' + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={'User-Agent': UA})
              with urllib.request.urlopen(req, timeout=45) as r:
                  return json.load(r)

          def acceptable(info):
              ext = info.get('extmetadata', {})
              short = (ext.get('LicenseShortName', {}).get('value') or '')
              lic = (ext.get('License', {}).get('value') or '')
              blob = f'{short} {lic}'
              if BAD.search(blob):
                  return None
              if not (OK_LICENCES.search(short) or OK_LICENCES.search(lic)):
                  return None
              artist = re.sub(r'<[^>]+>', '', ext.get('Artist', {}).get('value') or '').strip()
              return {
                  'licence': short or lic,
                  'credit': artist or 'Wikimedia Commons',
                  'source': info.get('descriptionshorturl') or info.get('url'),
              }

          # The sign list is the TypeScript file's `search` arrays. Parsing it
          # rather than duplicating it keeps one source of truth: a sign added
          # in the app is fetched here with no second edit.
          # Files a human has already looked at and rejected. The list lives in
          # the app because that is where the reasoning belongs ("a microscopic
          # fragment cannot demonstrate the bedside appearance of a nail
          # sign"), and the fetcher never read it — so a rejected file was free
          # to come straight back on the next run.
          try:
              banned_src = pathlib.Path(
                  'mobile/src/lib/curatedExamPhotos.ts').read_text()
              m_ban = re.search(r'EXCLUDED_EXAM_PHOTOS\s*=\s*new Set\(\[(.*?)\]\)',
                                banned_src, re.S)
              # Match the CLOSING quote with a backreference, not "any quote".
              #
              # One of these titles contains an apostrophe — "File:P 451
              # Harper's vol121--Face assumed a deadly pallor.png" — so it is
              # written in double quotes, and a single-quote pattern latched
              # onto that apostrophe and desynchronised every entry after it.
              # The list silently shrank to one, and the wrestler this list
              # exists to keep out was fetched again on the very next run.
              BANNED = {t for _, t in
                        re.findall(r"(['\"])(File:.*?)\1", m_ban.group(1))} if m_ban else set()
          except Exception:
              BANNED = set()
          print(f'{len(BANNED)} file(s) previously rejected by a human will be refused')

          src = pathlib.Path('mobile/src/lib/generalExamSigns.ts').read_text()
          signs = []
          for block in re.findall(r"\{\s*id: '([a-z0-9-]+)',(.*?)\n  \},", src, re.S):
              sid, body = block
              m = re.search(r"search: \[(.*?)\]", body, re.S)
              if not m:
                  continue
              terms = re.findall(r"'([^']+)'", m.group(1))
              # The corroboration gate. Commons full-text search matches the
              # file PAGE, not the subject, so the first freely-licensed hit for
              # "clubbing" was a portrait of a film-maker and the first for
              # "platonychia" was a Roman bronze nail cleaner. At least one of
              # these words must be in the file TITLE or the hit is refused.
              g = re.search(r"titleMustContain: \[(.*?)\]", body, re.S)
              gate = re.findall(r"'([^']+)'", g.group(1)) if g else []
              # Named files are tried before the search. Naming a file IS the
              # corroboration, and a stronger one than a substring of a title,
              # so the gate is not applied to them. The licence check still is.
              n = re.search(r"commonsFiles: \[(.*?)\]", body, re.S)
              named = re.findall(r"'([^']+)'", n.group(1)) if n else []
              c = re.search(r"commonsCategories: \[(.*?)\]", body, re.S)
              cats = re.findall(r"'([^']+)'", c.group(1)) if c else []
              signs.append((sid, terms, gate, named, cats))

          # ── Europe PMC: figures from open-access case reports ──────────
          #
          # The corpus Open-i indexes, reached directly and with a documented,
          # stable API. A case report about anaemia contains a photograph of
          # the patient's conjunctiva, captioned, and if the article is CC BY
          # that figure is usable with attribution. This is the only source in
          # the chain that finds a picture BECAUSE a doctor wrote about the
          # sign rather than because somebody named a file after it.
          EPMC = 'https://www.ebi.ac.uk/europepmc/webservices/rest/'

          # Eight articles, and at most four figures from each.
          #
          # This fetches the FULL TEXT of every article it looks at, so the
          # cost is one HTTP request per article on top of the search. At 25
          # articles x 3 terms x 19 signs that is well over a thousand
          # requests, and a probe of every sign ran for eighteen minutes
          # without finishing. Eight is plenty: a figure that shows the sign is
          # in the first few case reports or it is not there at all.
          def europepmc(term, limit=8, max_figs=4):
              q = f'"{term}" AND OPEN_ACCESS:Y AND HAS_FT:Y'
              url = EPMC + 'search?' + urllib.parse.urlencode({
                  'query': q, 'format': 'json', 'pageSize': str(limit),
                  'resultType': 'core',
              })
              req = urllib.request.Request(url, headers={'User-Agent': UA})
              with urllib.request.urlopen(req, timeout=60) as r:
                  data = json.load(r)
              out = []
              for art in data.get('resultList', {}).get('result', []):
                  lic = (art.get('license') or '').lower()
                  # cc-by and cc0 only. cc-by-nc / -nd are refused here as
                  # everywhere else, and an article with no stated licence is
                  # not an article with a permissive one.
                  if not lic or 'nc' in lic or 'nd' in lic:
                      continue
                  if not ('cc' in lic and 'by' in lic or lic in ('cc0', 'pd')):
                      continue
                  pmcid = art.get('pmcid')
                  if not pmcid:
                      continue
                  try:
                      fx = urllib.request.Request(EPMC + f'{pmcid}/fullTextXML',
                                                  headers={'User-Agent': UA})
                      with urllib.request.urlopen(fx, timeout=60) as r2:
                          xml = r2.read().decode('utf-8', 'replace')
                  except Exception:
                      continue
                  # Each <fig> carries a caption and a graphic href. The caption
                  # is what says whether the figure shows the sign; the article
                  # title does not.
                  for fig in re.findall(r'<fig\b.*?</fig>', xml, re.S)[:max_figs]:
                      cap = re.sub(r'<[^>]+>', ' ', fig)
                      cap = re.sub(r'\s+', ' ', cap).strip()
                      href = re.search(r'xlink:href="([^"]+)"', fig)
                      if not href:
                          continue
                      out.append({
                          'title': cap[:200],
                          'url': f'https://www.ncbi.nlm.nih.gov/pmc/articles/{pmcid}/bin/{href.group(1)}.jpg',
                          'licence': art.get('license', 'CC BY'),
                          'credit': (art.get('authorString') or 'PubMed Central')[:120],
                          'source': f'https://www.ncbi.nlm.nih.gov/pmc/articles/{pmcid}/',
                      })
              return out

          # A comma-separated list, not one id. Probing five blank signs one at
          # a time is five dispatches and five waits, for a question that is
          # one question: "is there anything out there for these?"
          only = os.environ.get('ONLY', '').strip()
          wanted = {x.strip() for x in only.split(',') if x.strip()}
          probe = os.environ.get('PROBE', '').strip().lower() in ('true', '1', 'yes')
          if wanted:
              signs = [s for s in signs if s[0] in wanted]
              missing = wanted - {s[0] for s in signs}
              if missing:
                  print(f'  warn  no such sign id: {", ".join(sorted(missing))}')

          # Read back what previous runs found, so a re-dispatch tops up
          # rather than starting over and re-downloading everything.
          manifest = {}
          m = re.search(r'export const SIGN_IMAGES[^=]*=\s*(\{.*\});\s*$',
                        MANIFEST.read_text(), re.S)
          if m and m.group(1).strip() != '{}':
              manifest = json.loads(m.group(1))

          # ── Probe: show what is out there, commit nothing ──────────────
          #
          # Added after four rounds of picking a wrong picture for "pallor" —
          # an engraving, a wrestler, a beer parlour and a pale-winged
          # starling. Each round was a blind guess followed by a download,
          # because nothing ever printed the CANDIDATES, only the winner.
          #
          # This prints every source's offer for one sign so a person can
          # choose from a list instead of re-running the whole thing and
          # hoping. It writes nothing and commits nothing.
          if probe:
              for sid, terms, gate, named, categories in signs:
                  print(f'\n=== {sid} ===  gate={gate}')
                  for cat in categories:
                      try:
                          mem = api(list='categorymembers', cmtitle=cat,
                                    cmtype='file', cmlimit='40')
                          names = [m['title'] for m in
                                   mem.get('query', {}).get('categorymembers', [])]
                      except Exception as e:
                          print(f'  [category] {cat}: FAILED {e}')
                          continue
                      print(f'  [category] {cat}: {len(names)} file(s)')
                      for n in names[:25]:
                          print(f'      {n}')
                  for term in terms[:3]:
                      for label, fn in (('open-i', openi), ('europepmc', europepmc),
                                        ('openverse', openverse)):
                          try:
                              hits = fn(term)
                          except Exception as e:
                              print(f'  [{label}] "{term}": FAILED {e}')
                              continue
                          print(f'  [{label}] "{term}": {len(hits)} hit(s)')
                          for h in hits[:12]:
                              print(f'      {h["licence"]:<18} {h["title"][:110]}')
                              print(f'         {h["url"][:150]}')
              print('\nprobe only — nothing fetched, nothing committed.')
              raise SystemExit(0)

          for sid, terms, gate, named, categories in signs:
              if sid in manifest and not wanted:
                  print(f'  skip  {sid} (already has a picture)')
                  continue
              chosen = None
              # 1. The named files, in order. A title that does not exist comes
              #    back as a page with 'missing' and is skipped, so a wrong
              #    guess costs a log line and nothing else.
              if named:
                  try:
                      info = api(prop='imageinfo', titles='|'.join(named),
                                 iiprop='url|extmetadata|mime|size', iiurlwidth='1200')
                      pages = info.get('query', {}).get('pages', {})
                      by_title = {p.get('title'): p for p in pages.values()}
                      for want in named:
                          page = by_title.get(want)
                          if not page or 'missing' in page:
                              print(f'  miss  {sid}: no such file "{want}"')
                              continue
                          ii = (page.get('imageinfo') or [None])[0]
                          if not ii:
                              print(f'  miss  {sid}: "{want}" has no image info')
                              continue
                          if ii.get('mime') not in ('image/jpeg', 'image/png'):
                              print(f'  skip  {sid}: "{want}" is {ii.get("mime")}')
                              continue
                          lic = acceptable(ii)
                          if not lic:
                              short = ii.get('extmetadata', {}).get(
                                  'LicenseShortName', {}).get('value', '?')
                              print(f'  deny  {sid}: "{want}" licence {short!r} '
                                    f'is not commercial-use')
                              continue
                          chosen = (want, ii.get('thumburl') or ii['url'], lic)
                          print(f'  named {sid}: taking "{want}"')
                          break
                  except Exception as e:
                      print(f'  warn  {sid}: named lookup failed: {e}')

              # 1b. Open-i FIRST. It is the only source here whose corpus is
              #     clinical and whose filter says "photograph". It was last
              #     in the chain, so Commons always answered before it was
              #     asked — and Commons' answer for pallor was a bird.
              if not chosen:
                  for term in terms[:3]:
                      try:
                          hits = openi(term)
                      except Exception as e:
                          print(f'  warn  {sid}: open-i "{term}" failed: {e}')
                          continue
                      print(f'  openi {sid}: "{term}" -> {len(hits)} usable-licence photo(s)')
                      for hit in hits:
                          cap = hit['title'].lower()
                          if gate and not any(w.lower() in cap for w in gate):
                              continue
                          chosen = (hit['title'][:180], hit['url'],
                                    {'licence': hit['licence'],
                                     'credit': hit['credit'],
                                     'source': hit['source']})
                          print(f'  openi {sid}: taking "{hit["title"][:90]}"')
                          break
                      if chosen:
                          break

              # 1c. Commons CATEGORIES. Membership is a human's judgement that
              #     the file depicts the thing, which is exactly what a word
              #     search cannot tell you. The title gate is still applied,
              #     because a category can be broad ("Anemia" holds blood
              #     smears and charts as well as patients).
              for cat in ([] if chosen else categories):
                  try:
                      members = api(list='categorymembers', cmtitle=cat,
                                    cmtype='file', cmlimit='50')
                      titles = [m['title'] for m in
                                members.get('query', {}).get('categorymembers', [])]
                  except Exception as e:
                      print(f'  warn  {sid}: category "{cat}" failed: {e}')
                      continue
                  if not titles:
                      print(f'  cat   {sid}: "{cat}" is empty')
                      continue
                  print(f'  cat   {sid}: "{cat}" has {len(titles)} file(s)')
                  for batch in [titles[i:i + 40] for i in range(0, len(titles), 40)]:
                      try:
                          info = api(prop='imageinfo|categories',
                                     titles='|'.join(batch),
                                     iiprop='url|extmetadata|mime|size',
                                     iiurlwidth='1200', cllimit='max')
                      except Exception:
                          continue
                      for page in info.get('query', {}).get('pages', {}).values():
                          ii = (page.get('imageinfo') or [None])[0]
                          if not ii or ii.get('mime') not in ('image/jpeg', 'image/png'):
                              continue
                          t_l = page['title'].lower()
                          if gate and not any(w.lower() in t_l for w in gate):
                              continue
                          if page['title'] in BANNED:
                              continue
                          if any(v.get('commonsTitle') == page['title']
                                 for v in manifest.values()):
                              continue
                          cat_blob = ' '.join(c.get('title', '')
                                              for c in (page.get('categories') or []))
                          if NOT_A_PHOTOGRAPH.search(page['title'] + ' ' + cat_blob):
                              continue
                          lic = acceptable(ii)
                          if not lic:
                              continue
                          chosen = (page['title'], ii.get('thumburl') or ii['url'], lic)
                          print(f'  cat   {sid}: taking "{page["title"]}" from {cat}')
                          break
                      if chosen:
                          break
                  if chosen:
                      break

              # 2. Only then the searches: the title gate's own words first,
              #    then the free-text terms.
              for term in ([] if chosen else list(queries(terms, gate))):
                  try:
                      res = api(list='search', srsearch=term,
                                srnamespace='6', srlimit='20')
                  except Exception as e:
                      print(f'  warn  {sid}: search "{term}" failed: {e}')
                      continue
                  titles = [h['title'] for h in res.get('query', {}).get('search', [])]
                  if not titles:
                      continue
                  try:
                      info = api(prop='imageinfo|categories', titles='|'.join(titles),
                                 iiprop='url|extmetadata|mime|size', iiurlwidth='1200',
                                 cllimit='max')
                  except Exception as e:
                      print(f'  warn  {sid}: imageinfo failed: {e}')
                      continue
                  for page in info.get('query', {}).get('pages', {}).values():
                      ii = (page.get('imageinfo') or [None])[0]
                      if not ii:
                          continue
                      if ii.get('mime') not in ('image/jpeg', 'image/png'):
                          continue
                      # Corroboration before licence: a wrong picture with a
                      # perfect licence is still a wrong picture, and a
                      # plausible wrong one is worse than none because the
                      # reader trusts it.
                      title_l = page['title'].lower()
                      if gate and not any(w.lower() in title_l for w in gate):
                          continue
                      if page['title'] in BANNED:
                          print(f'  bann  {sid}: "{page["title"]}" was rejected by a '
                                f'human and stays rejected')
                          continue
                      # One picture may not serve two signs. The same
                      # arterial-thrombosis photograph was taken for BOTH
                      # cyanosis entries, and it shows peripheral cyanosis, so
                      # it was right once and wrong once.
                      if any(v.get('commonsTitle') == page['title']
                             for v in manifest.values()):
                          print(f'  dupe  {sid}: "{page["title"]}" already belongs '
                                f'to another sign')
                          continue
                      cats = ' '.join(
                          c.get('title', '') for c in (page.get('categories') or []))
                      if NOT_A_PHOTOGRAPH.search(page['title'] + ' ' + cats):
                          print(f'  art   {sid}: "{page["title"]}" is artwork or a '
                                f'book illustration, not a clinical photograph')
                          continue
                      lic = acceptable(ii)
                      if not lic:
                          continue
                      chosen = (page['title'], ii.get('thumburl') or ii['url'], lic)
                      break
                  if chosen:
                      break

              # 3. Openverse, which indexes far more than Commons does.
              if not chosen:
                  for term in terms[:3]:
                      try:
                          hits = openverse(term)
                      except Exception as e:
                          print(f'  warn  {sid}: openverse "{term}" failed: {e}')
                          continue
                      for hit in hits:
                          t_l = hit['title'].lower()
                          if gate and not any(w.lower() in t_l for w in gate):
                              continue
                          if NOT_A_PHOTOGRAPH.search(hit['title']):
                              continue
                          if hit['title'] in BANNED:
                              continue
                          if any(v.get('commonsTitle') == hit['title']
                                 for v in manifest.values()):
                              continue
                          chosen = (hit['title'], hit['url'],
                                    {'licence': hit['licence'],
                                     'credit': hit['credit'],
                                     'source': hit['source']})
                          print(f'  open  {sid}: taking "{hit["title"]}" '
                                f'({hit["licence"]}) from Openverse')
                          break
                      if chosen:
                          break

              if not chosen:
                  print(f'  NONE  {sid} — nothing passed the title gate {gate} with an '
                        f'acceptable licence. It stays text-only, which is the '
                        f'correct outcome, not a bug to loosen the gate for.')
                  # Say what WAS on offer, which is the difference between a
                  # blank somebody can act on and one nobody can. A run that
                  # only prints NONE leaves the next person repeating the same
                  # search by hand to find out whether the problem is the gate,
                  # the licence, or that Commons simply has no such picture.
                  for term in list(queries(terms, gate))[:4]:
                      try:
                          res = api(list='search', srsearch=term,
                                    srnamespace='6', srlimit='10')
                      except Exception:
                          continue
                      hits = [h['title'] for h in res.get('query', {}).get('search', [])]
                      if not hits:
                          print(f'        "{term}" -> no files at all')
                          continue
                      try:
                          info = api(prop='imageinfo', titles='|'.join(hits),
                                     iiprop='url|extmetadata|mime')
                      except Exception:
                          continue
                      print(f'        "{term}" offered:')
                      for page in info.get('query', {}).get('pages', {}).values():
                          ii = (page.get('imageinfo') or [None])[0]
                          short = (ii or {}).get('extmetadata', {}).get(
                              'LicenseShortName', {}).get('value', '?') if ii else '?'
                          passes = bool(gate) and any(
                              w.lower() in page['title'].lower() for w in gate)
                          print(f'          [{"title-ok" if passes else "gated  "}] '
                                f'{short:<18} {page["title"]}')
                  continue

              title, url, lic = chosen
              ext = '.png' if url.lower().endswith('.png') else '.jpg'
              name = f'{sid}{ext}'
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': UA})
                  with urllib.request.urlopen(req, timeout=90) as r:
                      data = r.read()
              except Exception as e:
                  print(f'  FAIL  {sid}: download failed: {e}')
                  continue
              (OUT / name).write_bytes(data)
              manifest[sid] = {
                  'file': f'signs/{name}',
                  'credit': lic['credit'],
                  'licence': lic['licence'],
                  'source': lic['source'],
                  'commonsTitle': title,
              }
              print(f'  ok    {sid}  {len(data)//1024} KB  {lic["licence"]}  ({title})')

          # Generated TypeScript, not JSON: a JSON import would need
          # resolveJsonModule, which comes from the React Native tsconfig
          # preset and is a flag this repo does not own.
          body = json.dumps(manifest, indent=2, sort_keys=True)
          MANIFEST.write_text(
              HEADER + 'export const SIGN_IMAGES: Record<string, FetchedSignImage> = '
              + body + ';\n')
          print(f'\n{len(manifest)} sign(s) have a picture.')
          PY

      - name: Commit what was fetched
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- public/diagrams/signs mobile/src/lib/examSignImages.ts; then
            echo 'Nothing new. Not committing.'
            exit 0
          fi
          git add public/diagrams/signs mobile/src/lib/examSignImages.ts
          git commit -m 'chore(signs): fetch freely-licensed photographs for the general examination

          Fetched by .github/workflows/exam-sign-images.yml from Wikimedia
          Commons, public domain and commercial-use Creative Commons only.
          Attribution is in mobile/src/lib/examSignImages.ts and is shown
          under each picture in the app.'
          git push origin HEAD:${{ github.ref_name }}
          echo 'Run supabase-tasks.yml next — its upload step puts these in the bucket.'

name: Import HRA heart reference

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-hra-heart.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-hra-heart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download official HRA male heart
        run: |
          set -euxo pipefail
          rm -f public/models/hra_heart_male_v1.3.glb
          curl -L --fail --retry 3             "https://raw.githubusercontent.com/hubmapconsortium/ccf-releases/main/v1.3/models/VH_M_Heart.glb"             -o public/models/hra_heart_male_v1.3.glb
          test "$(stat -c%s public/models/hra_heart_male_v1.3.glb)" -gt 3000000
          test "$(stat -c%s public/models/hra_heart_male_v1.3.glb)" -lt 5000000
      - name: Verify interventricular septum exists
        run: |
          node scripts/inspect-hra-heart.mjs             public/models/hra_heart_male_v1.3.glb             /tmp/hra-heart-check.json
          node <<'NODE'
          const m=require('/tmp/hra-heart-check.json');
          const names=[...m.nodes.map(x=>x.name),...m.meshes.map(x=>x.name)];
          if(!names.some(n=>n==='VH_M_interventricular_septum')){
            throw new Error('HRA interventricular septum mesh is missing');
          }
          console.log('Verified HRA interventricular septum mesh.');
          NODE
      - name: Commit HRA heart reference
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/hra_heart_male_v1.3.glb
          if git diff --cached --quiet; then
            echo "HRA heart already current"
          else
            git commit -m "Add HRA heart reference for internal septum"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

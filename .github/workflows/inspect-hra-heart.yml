name: Inspect HRA heart source

on:
  push:
    branches: [main]
    paths:
      - "scripts/inspect-hra-heart.mjs"
      - ".github/workflows/inspect-hra-heart.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-hra-heart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download HRA male heart
        run: |
          curl -L --fail --retry 3             "https://raw.githubusercontent.com/hubmapconsortium/ccf-releases/main/v1.3/models/VH_M_Heart.glb"             -o /tmp/VH_M_Heart.glb
          test "$(stat -c%s /tmp/VH_M_Heart.glb)" -gt 3000000
      - name: Inventory GLB
        run: |
          node scripts/inspect-hra-heart.mjs /tmp/VH_M_Heart.glb docs/hra-heart-inventory.json
          test -s docs/hra-heart-inventory.json
      - name: Commit inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/hra-heart-inventory.json
          if git diff --cached --quiet; then
            echo "No inventory changes"
          else
            git commit -m "Inventory HRA heart structures"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

name: Integration mobile verification

on:
  push:
    branches:
      - chatgpt/integrate-claude-handoff-v23

permissions:
  contents: read

concurrency:
  group: integration-mobile-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Lint
        working-directory: mobile
        run: npx eslint . --quiet

      - name: Claude handoff checks
        working-directory: mobile
        run: |
          npm run check:proformas
          npm run check:exam-signs
          npm run check:ads
          npm run check:edges
          npm run check:keyboard
          npm run check:version
          npm run check:repo-intact
          npm run check:agent-docs
          npm run check:note-links
          npm run check:supabase-queue

      - name: Core mobile checks
        working-directory: mobile
        run: |
          npm run check:fanout
          npm run check:mcq
          npm run check:notes-limits
          npm run check:notes-schema
          npm run check:sync
          npm run check:cloud-ids
          npm run check:android-res
          npm run check:theme-from-image
          npm run check:glass
          npm run check:native-sound
          npm run check:subject-cards
          npm run check:contrast
          npm run check:anki
          npm run check:textbooks
          npm run check:one-app
          npm run check:flashcard-size
          npm run check:streak
          npm run check:preview-parity
          npm run check:native-update
          npm run check:billing
          npm run check:attendance
          npm run check:admin
          npm run check:no-simulator

      - name: Install Android components
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          install_one() {
            for candidate in "$@"; do
              if "$SDKM" "$candidate"; then return 0; fi
            done
            return 1
          }
          [ -d "$SDK/platforms/android-37" ] || [ -d "$SDK/platforms/android-37.0" ] || install_one "platforms;android-37.0" "platforms;android-37"
          [ -d "$SDK/build-tools/37.0.0" ] || install_one "build-tools;37.0.0"
          [ -d "$SDK/ndk/27.1.12297006" ] || install_one "ndk;27.1.12297006"

      - name: Build preview APK
        working-directory: mobile
        run: printf 'export const ADS_ENABLED = false;\n' > src/lib/adsMode.ts && cd android && ./gradlew assemblePreview --no-daemon --stacktrace

name: Native 548 Advanced Skills Evidence

on:
  push:
    branches: [codex/native-548-advanced-evidence-20261015]
    paths:
      - '.github/workflows/native-548-advanced-evidence.yml'
      - 'mobile/**'
      - '.github/workflows/android-debug.yml'
  workflow_dispatch:

concurrency:
  group: native-mobile-ui-evidence-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  controls:
    strategy:
      fail-fast: false
      matrix:
        suite: [eye, auscultation, auscultation-case, pocus, general]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install browser reference dependencies
        run: |
          npm ci --legacy-peer-deps --ignore-scripts
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for matching Android debug build
        id: debug
        uses: actions/github-script@v7
        with:
          script: |
            const sourceSha='8a0bf81c9f471beb37344dc70715736b7aedff85';
            const {data:comparison}=await github.rest.repos.compareCommits({...context.repo,base:sourceSha,head:context.sha});
            const allowed=new Set(['.github/workflows/native-548-advanced-evidence.yml','mobile/scripts/native_advanced_skills.py','mobile/scripts/read_android_advanced.mjs','mobile/scripts/vercel_mobile_advanced_skills.mjs']);
            if(comparison.status!=='ahead'||!comparison.files?.length||comparison.files.some(file=>!allowed.has(file.filename))) throw Error('APK reuse rejected: runtime changes outside the evidence files');
            const fs=require('fs');
            fs.mkdirSync('artifacts/native-vault-parity',{recursive:true});
            fs.writeFileSync('artifacts/native-vault-parity/apk-provenance.json',JSON.stringify({apkSourceSha:sourceSha,captureSourceSha:context.sha,onlyEvidenceFilesChanged:true},null,2));
            for (let attempt=0;attempt<240;attempt++){
              const {data}=await github.rest.actions.listWorkflowRuns({
                ...context.repo,workflow_id:'android-debug.yml',head_sha:sourceSha,per_page:10
              });
              const run=data.workflow_runs.find(r=>r.head_sha===sourceSha && r.conclusion!=='cancelled');
              if(run?.status==='completed'){
                if(run.conclusion!=='success') throw new Error('Debug build failed: '+run.conclusion);
                core.setOutput('run_id',run.id);return;
              }
              await new Promise(resolve=>setTimeout(resolve,15000));
            }
            throw new Error('Timed out waiting for a matching native debug APK');
      - id: apk
        uses: actions/download-artifact@v4
        with:
          name: orbit-debug-apk
          path: downloaded-apk
          run-id: ${{ steps.debug.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Screenshot the actual Vercel clinical studio for reference
        run: |
          mkdir -p artifacts/native-vault-parity
          node mobile/scripts/native-anatomy-parity-manifest.mjs artifacts/native-vault-parity/anatomy-coverage.json
          ORBIT_ADVANCED_SUITE=${{ matrix.suite }} node mobile/scripts/vercel_mobile_advanced_skills.mjs artifacts/native-vault-parity

      - name: Enable emulator acceleration
        if: ${{ !cancelled() && steps.apk.outcome == 'success' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the Android emulator image with retries
        if: ${{ !cancelled() && steps.apk.outcome == 'success' }}
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo 'Command line tools will be installed by the emulator action.'
            exit 0
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          for attempt in 1 2 3; do
            if "$SDKMANAGER" --install 'system-images;android-35;google_apis;x86_64' --channel=0; then
              exit 0
            fi
            python3 -c 'import os,pathlib,shutil; root=pathlib.Path(os.environ["ANDROID_HOME"])/".temp"; [(shutil.rmtree(p) if p.is_dir() and not p.is_symlink() else p.unlink()) for p in root.glob("PackageOperation*")]'
            sleep 5
          done
          exit 1

      - name: Screenshot actual installed React Native views on Android
        if: ${{ !cancelled() && steps.apk.outcome == 'success' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -gpu ${{ matrix.suite == 'eye' && 'lavapipe' || 'software' }} -memory 3072 -cores 2 -noaudio -no-boot-anim
          script: |
            adb shell wm size 1179x2556
            adb shell wm density 480
            adb install -r downloaded-apk/app-preview.apk
            bash mobile/scripts/build-ui-dump.sh
            adb shell wm size > artifacts/native-vault-parity/android-display-size.txt
            adb shell wm density > artifacts/native-vault-parity/android-display-density.txt
            ORBIT_ADVANCED_SUITE=${{ matrix.suite }} ORBIT_UI_HELPER=1 ORBIT_SCREENSHOT_OUT=artifacts/native-vault-parity python3 mobile/scripts/native_advanced_skills.py

      - name: Preserve host diagnostics for an emulator process exit
        if: always()
        run: |
          free -m > artifacts/native-vault-parity/host-memory.txt
          ps -eo pid,rss,comm --sort=-rss | head -20 > artifacts/native-vault-parity/host-process-memory.txt
          (dmesg 2>&1 | tail -80) > artifacts/native-vault-parity/host-kernel-tail.txt || true

      - name: Upload side-by-side evidence (unapproved WIP, not a release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-548-advanced-${{ matrix.suite }}-${{ github.sha }}
          path: artifacts/native-vault-parity/
          if-no-files-found: warn
          retention-days: 14


name: Native 551 Focused Drawer Verification

on:
  push:
    branches: [codex/native-551-fast-drawer-evidence-20261016]
    paths:
      - '.github/workflows/native-551-fast-drawer-evidence.yml'
      - 'mobile/scripts/**'
  workflow_dispatch:

concurrency:
  group: native-drawer-evidence-${{ github.sha }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  anatomy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Wait for matching Android debug build
        id: debug
        uses: actions/github-script@v7
        with:
          script: |
            const sourceSha='d3b39ee7f233de9da1eabb13d1c15c39840b3752';
            const {data:comparison}=await github.rest.repos.compareCommits({
              ...context.repo,base:sourceSha,head:context.sha
            });
            const allowed=new Set([
              '.github/workflows/native-551-fast-drawer-evidence.yml',
              'mobile/scripts/native_anatomy_screenshots.py',
              'mobile/scripts/read_android_webview.mjs',
              'mobile/scripts/audit_native_vault_screenshots.py',
            ]);
            if(comparison.status!=='ahead' || !comparison.files?.length || comparison.files.some(file=>!allowed.has(file.filename))) {
              throw Error('Evidence-only APK reuse rejected: app/runtime source differs or diff is incomplete');
            }
            const fs=require('fs');
            fs.mkdirSync('artifacts/native-vault-parity',{recursive:true});
            fs.writeFileSync('artifacts/native-vault-parity/apk-provenance.json',JSON.stringify({apkSourceSha:sourceSha,captureSourceSha:context.sha,onlyEvidenceFilesChanged:true},null,2));
            for (let attempt=0;attempt<240;attempt++){
              const {data}=await github.rest.actions.listWorkflowRuns({
                ...context.repo,workflow_id:'android-debug.yml',head_sha:sourceSha,per_page:10
              });
              const run=data.workflow_runs.find(r=>r.head_sha===sourceSha && r.conclusion!=='cancelled');
              if(run?.status==='completed'){
                if(run.conclusion!=='success') throw new Error('Debug build failed: '+run.conclusion);
                core.setOutput('run_id',run.id);return;
              }
              await new Promise(resolve=>setTimeout(resolve,15000));
            }
            throw new Error('Timed out waiting for a matching native debug APK');
      - id: apk
        uses: actions/download-artifact@v4
        with:
          name: orbit-debug-apk
          path: downloaded-apk
          run-id: ${{ steps.debug.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Reuse actual mobile Vercel heart and vessels references
        uses: actions/download-artifact@v4
        with:
          name: native-548-drawer-probe-c3e588e7970197d85a8f67f4a7515f1b99d8ea9f
          path: previous-evidence
          run-id: 38785388188
          github-token: ${{ github.token }}
      - name: Record the explicitly focused two-target scope
        run: |
          mkdir -p artifacts/native-vault-parity
          cp previous-evidence/anatomy-vercel-*.png artifacts/native-vault-parity/
          cp previous-evidence/vercel-anatomy-captures.json artifacts/native-vault-parity/
          cp previous-evidence/anatomy-coverage.json artifacts/native-vault-parity/
          python3 -c 'import json,pathlib; p=pathlib.Path("artifacts/native-vault-parity/anatomy-coverage.json"); d=json.loads(p.read_text()); d["auditTargetIds"]=["heart","vessels"]; d["referenceRun"]=38785388188; p.write_text(json.dumps(d))'

      - name: Enable emulator acceleration
        if: ${{ !cancelled() && steps.apk.outcome == 'success' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Screenshot actual installed React Native views on Android
        if: ${{ !cancelled() && steps.apk.outcome == 'success' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -gpu software -noaudio -no-boot-anim
          script: |
            adb shell wm size 1179x2556
            adb shell wm density 480
            adb install -r downloaded-apk/app-preview.apk
            bash mobile/scripts/build-ui-dump.sh
            adb shell wm size > artifacts/native-vault-parity/android-display-size.txt
            adb shell wm density > artifacts/native-vault-parity/android-display-density.txt
            ORBIT_ANATOMY_LAYOUT_ASSERT=1 ORBIT_ANATOMY_TARGETS=heart,vessels ORBIT_ANATOMY_REFERENCE=browser ORBIT_UI_HELPER=1 ORBIT_SCREENSHOT_OUT=artifacts/native-vault-parity python3 mobile/scripts/native_anatomy_screenshots.py

      - name: Assemble actual browser and installed Android comparisons
        if: always()
        run: |
          python3 -m pip install --quiet --break-system-packages pillow
          python3 mobile/scripts/audit_native_vault_screenshots.py artifacts/native-vault-parity --anatomy-only

      - name: Upload side-by-side evidence (unapproved WIP, not a release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-551-focused-drawer-${{ github.sha }}
          path: artifacts/native-vault-parity/
          if-no-files-found: warn
          retention-days: 14

name: Build native offline auscultation reference loops
on:
  push:
    branches: [codex/native-offline-simulator]
    paths: ['.github/workflows/native-auscultation-source.yml', 'scripts/build-native-auscultation.mjs']
permissions:
  contents: write
concurrency:
  group: native-audio-source
  cancel-in-progress: true
jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --legacy-peer-deps
      - working-directory: mobile
        run: npm ci --legacy-peer-deps
      - run: npm install --legacy-peer-deps --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/build-native-auscultation.mjs
      - name: Save generated source-derived audio only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/clinical-reference/auscultation
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Package reproducible offline auscultation loops from shared DSP'
          git pull --rebase origin codex/native-offline-simulator
          git push origin HEAD:codex/native-offline-simulator
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-auscultation-audit
          path: public/clinical-reference/auscultation/manifest.json

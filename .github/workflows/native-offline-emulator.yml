name: Native offline Android emulator verification
on:
  push:
    branches: [codex/native-offline-simulator]
    paths: ['.github/workflows/native-offline-emulator.yml', 'scripts/native-offline-device-check.py']
permissions:
  contents: read
concurrency:
  group: native-offline-emulator
  cancel-in-progress: true
jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --legacy-peer-deps
      - working-directory: mobile
        run: npm ci --legacy-peer-deps
      - name: Build complete offline content
        run: |
          node scripts/build-pg-compact.mjs
          node scripts/check-pg-release-content.mjs
          node --experimental-strip-types scripts/build-native-simulator-assets.mjs
          node scripts/build-native-simulator-lessons.mjs
          node --experimental-strip-types scripts/check-native-offline-assets.mjs
      - name: Check native code
        working-directory: mobile
        run: |
          npx tsc --noEmit
          npx eslint src/screens/SimulatorScreen.android.tsx src/simulator src/native/OrbitAnatomy.tsx src/native/OrbitMRI.tsx src/native/OrbitPOCUS.tsx --quiet
          npm run check:kotlin
          npm run check:version
          node --experimental-strip-types scripts/annotation-geometry-check.mjs
      - name: Disable every ad in the preview
        working-directory: mobile
        run: printf 'export const ADS_ENABLED = false;\n' > src/lib/adsMode.ts
      - name: Enable local setup only in this separately installable preview
        working-directory: mobile
        run: |
          node scripts/auth-mode-check.mjs
          printf 'export const GOOGLE_SIGN_IN_ENABLED = false;\n' > src/lib/authMode.ts
          node scripts/auth-mode-check.mjs --debug-apk
      - name: Give this separately installable preview a clear launcher name
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('mobile/android/app/src/main/res/values/strings.xml')
          p.write_text(p.read_text().replace('<string name="app_name">Orbit MBBS</string>','<string name="app_name">ORBIT Native Preview</string>'))
          PY
      - name: Install the SDK components the build pins
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          install_one() {
            for candidate in "$@"; do
              if "$SDKM" "$candidate"; then
                echo "installed $candidate"
                return 0
              fi
            done
            echo "::error::none of these could be installed: $*"
            return 1
          }
          [ -d "$SDK/platforms/android-37" ] || [ -d "$SDK/platforms/android-37.0" ] \
            || install_one "platforms;android-37.0" "platforms;android-37"
          [ -d "$SDK/build-tools/37.0.0" ] || install_one "build-tools;37.0.0"
          [ -d "$SDK/ndk/27.1.12297006" ] || install_one "ndk;27.1.12297006"



      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build packaged x86_64 preview for emulator
        working-directory: mobile/android
        run: ./gradlew assemblePreview -PreactNativeArchitectures=x86_64 --no-daemon --stacktrace
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb install mobile/android/app/build/outputs/apk/preview/app-preview.apk
            python scripts/native-offline-device-check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-offline-device-proof
          path: native-device-proof

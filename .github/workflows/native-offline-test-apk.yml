name: Native offline preview APK
on:
  push:
    branches: [codex/native-offline-simulator]
    paths:
      - '.github/workflows/native-offline-test-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: native-offline-preview-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --legacy-peer-deps
      - working-directory: mobile
        run: npm ci --legacy-peer-deps
      - name: Build complete offline content
        run: |
          node scripts/build-pg-compact.mjs
          node scripts/check-pg-release-content.mjs
          node --experimental-strip-types scripts/build-native-simulator-assets.mjs
          node scripts/build-native-simulator-lessons.mjs
          node --experimental-strip-types scripts/check-native-offline-assets.mjs
      - name: Check native code
        working-directory: mobile
        run: |
          npx tsc --noEmit
          npx eslint src/screens/SimulatorScreen.android.tsx src/simulator src/native/OrbitAnatomy.tsx src/native/OrbitMRI.tsx src/native/OrbitPOCUS.tsx --quiet
          npm run check:kotlin
          npm run check:version
          node --experimental-strip-types scripts/annotation-geometry-check.mjs
      - name: Disable every ad in the preview
        working-directory: mobile
        run: printf 'export const ADS_ENABLED = false;\n' > src/lib/adsMode.ts
      - name: Enable local setup only in this separately installable preview
        working-directory: mobile
        run: |
          node scripts/auth-mode-check.mjs
          printf 'export const GOOGLE_SIGN_IN_ENABLED = false;\n' > src/lib/authMode.ts
          node scripts/auth-mode-check.mjs --debug-apk
      - name: Give this separately installable preview a clear launcher name
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('mobile/android/app/src/main/res/values/strings.xml')
          p.write_text(p.read_text().replace('<string name="app_name">Orbit MBBS</string>','<string name="app_name">ORBIT Native Preview</string>'))
          PY
      - name: Install the SDK components the build pins
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          install_one() {
            for candidate in "$@"; do
              if "$SDKM" "$candidate"; then
                echo "installed $candidate"
                return 0
              fi
            done
            echo "::error::none of these could be installed: $*"
            return 1
          }
          [ -d "$SDK/platforms/android-37" ] || [ -d "$SDK/platforms/android-37.0" ] \
            || install_one "platforms;android-37.0" "platforms;android-37"
          [ -d "$SDK/build-tools/37.0.0" ] || install_one "build-tools;37.0.0"
          [ -d "$SDK/ndk/27.1.12297006" ] || install_one "ndk;27.1.12297006"



      - name: Build bundled ad-free ARM64 preview
        working-directory: mobile/android
        run: ./gradlew assemblePreview -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace
      - name: Verify packaged offline files and report actual APK size
        run: |
          python - <<'PY'
          import json, zipfile
          from pathlib import Path
          apk=next(Path('mobile/android/app/build/outputs/apk/preview').glob('*.apk'))
          with zipfile.ZipFile(apk) as z:
           names=set(z.namelist())
           print('Packaged model files: '+str(sorted(n for n in names if n.startswith('assets/simulator/models/'))[:8]))
           for item in ['assets/simulator/models/atlas.mesh.pack','assets/simulator/radiology/brain-t1.pack','assets/pg/manifest.json','assets/index.android.bundle','assets/simulator/auscultation/manifest.json','assets/simulator/pocus/plax.mp4','assets/simulator/pocus/subcostal.mp4']:
            assert item in names,item
           sound=json.loads(z.read('assets/simulator/auscultation/manifest.json'))
           assert len(sound['clips'])==212
           for clip in sound['clips']:
            item='assets/simulator/auscultation/'+clip['file']
            assert z.getinfo(item).compress_type==zipfile.ZIP_STORED, 'Android asset FD requires uncompressed audio: '+item
           report={'audioClips':len(sound['clips']),'audioClipBytes':sound['bytes'],'apkBytes':apk.stat().st_size,'apkMB':apk.stat().st_size/1000000,'offlineAssetBytes':sum(i.file_size for i in z.infolist() if i.filename.startswith(('assets/simulator/','assets/pg/'))),'abi':'arm64-v8a','package':'com.aistudio.mbbsqbank.aycxvd.debug','productionRelease':False}
          Path('native-preview-size.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report))
          PY
      - name: Publish clearly labelled native test APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: native-offline-preview-${{ github.run_number }}
          name: ORBIT Native Preview · offline simulator test
          prerelease: true
          make_latest: false
          body: |
            Native Android test build with packaged anatomy, MRI/X-ray references,
            ECG learning/cardiac cycle, 12-lead teaching ECG, pupil/reflex examination,
            bedside/clubbing panels, local heart/lung audio, cases/monitor and PG practice.
            Adds guided ECG lessons, QT correction and pressure–volume teaching loops,
            clearer organ leaders and direct selection within the focused model.
            Includes two-point MRI/X-ray measurements with explicit reference-image units,
            compact imaging controls, visible slider values and deliberate video playback
            when reduced-motion preferences are enabled. ECG controls prioritize the trace;
            image panning stays within the reference and anatomy controls reserve model space.
            ARM64 phones only. No ads. Installs beside the current production app;
            the launcher name is ORBIT Native Preview. Complete local display name/year/university setup; Google sign-in is
            disabled only for this separate test package. Production authentication
            is unchanged.

            This is an unfinished test build, not a production AAB or Play update.
            Includes archived ultrasound loops, native virtual calipers and teaching
            colour/M-mode controls. Android graphics,
            touch and actual audio playback still need device review.
            Full offline detail was chosen over the earlier 10 MB cap.

            Built from `${{ github.sha }}`.
            Source code: https://github.com/${{ github.repository }}/commit/${{ github.sha }}.
            Use the linked commit for this preview; automatic tag archives use the default branch.
          files: |
            mobile/android/app/build/outputs/apk/preview/*.apk
            native-preview-size.json
      - uses: actions/upload-artifact@v4
        with:
          name: native-offline-preview-apk
          path: |
            mobile/android/app/build/outputs/apk/preview/*.apk
            native-preview-size.json

name: Native Android screenshots

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-screenshots.yml'
      - 'mobile/scripts/native_screenshot_driver.py'
      - 'mobile/scripts/run_native_screenshot_apk.sh'
      - 'mobile/src/components/ClinicalProformaModal.tsx'
      - 'mobile/src/components/GeneralExamSheet.tsx'
      - 'mobile/src/components/GeneralExamSigns.tsx'
      - 'mobile/src/components/LabValuesSheet.tsx'
      - 'mobile/src/lib/clinicalProformas.ts'
      - 'mobile/src/lib/proformas/**'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: native-android-screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install JS dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      # Use the APK from this exact commit, including bundled clinical photos.
      - name: Wait for the matching debug APK
        id: debug
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 120; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...context.repo, workflow_id: 'android-debug.yml',
                head_sha: context.sha, per_page: 10,
              });
              const run = data.workflow_runs.find(r => r.head_sha === context.sha);
              if (run?.status === 'completed') {
                if (run.conclusion !== 'success') throw new Error(`Debug APK failed: ${run.conclusion}`);
                core.setOutput('run_id', run.id);
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 15000));
            }
            throw new Error('Timed out waiting for the matching debug APK');

      - name: Download matching native debug APK
        uses: actions/download-artifact@v4
        with:
          name: orbit-debug-apk
          path: downloaded-apk
          run-id: ${{ steps.debug.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Show APK
        run: find downloaded-apk -type f -maxdepth 3 -ls

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture real React Native Android screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_7_pro
          emulator-boot-timeout: 300
          disable-linux-hw-accel: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb install -r downloaded-apk/app-preview.apk
            python3 mobile/scripts/native_screenshot_driver.py

      - name: Upload native screenshot artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbit-native-android-screenshots-v23
          path: artifacts/native-screenshots/v23/*.png
          if-no-files-found: warn

      - name: Commit screenshots to main
        if: success()
        run: |
          if [ -n "$(git status --porcelain artifacts/native-screenshots/v23)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add artifacts/native-screenshots/v23
            git commit -m "chore(screenshots): capture native Android v23 case proforma"
            git push origin HEAD:main
          else
            echo "No screenshot changes to commit."
          fi

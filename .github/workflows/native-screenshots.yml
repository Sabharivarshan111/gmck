name: Native Android screenshots

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/native-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-android-screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install JS dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Disable ads in screenshot build
        working-directory: mobile
        run: printf 'export const ADS_ENABLED = false;\n' > src/lib/adsMode.ts

      - name: Install Android build components
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platforms;android-37.0" || "$SDKM" "platforms;android-37"
          "$SDKM" "build-tools;37.0.0"
          "$SDKM" "ndk;27.1.12297006"

      - name: Bundle dev JavaScript into native debug APK
        working-directory: mobile
        run: |
          mkdir -p android/app/src/main/assets android/app/src/main/res
          npx react-native bundle \
            --platform android \
            --dev true \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Build native Android debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Capture real React Native Android screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -euo pipefail
            APK="$(find mobile/android/app/build/outputs/apk/debug -name '*.apk' | head -1)"
            adb install -r "$APK"
            ORBIT_PACKAGE="com.aistudio.mbbsqbank.aycxvd.debug" \
            ORBIT_SCREENSHOT_OUT="artifacts/native-screenshots/v23" \
              python3 mobile/scripts/native_screenshot_driver.py

      - name: Upload native screenshot artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbit-native-android-screenshots-v23
          path: artifacts/native-screenshots/v23/*.png
          if-no-files-found: warn

      - name: Commit screenshots to main
        if: success()
        run: |
          if [ -n "$(git status --porcelain artifacts/native-screenshots/v23)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add artifacts/native-screenshots/v23
            git commit -m "chore(screenshots): capture native Android v23 case proforma"
            git push origin HEAD:main
          else
            echo "No screenshot changes to commit."
          fi

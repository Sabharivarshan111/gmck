name: Native Android screenshots

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/native-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-android-screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install JS dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Disable ads in screenshot build
        working-directory: mobile
        run: printf 'export const ADS_ENABLED = false;\n' > src/lib/adsMode.ts

      - name: Bundle dev JavaScript into native debug APK
        working-directory: mobile
        run: |
          mkdir -p android/app/src/main/assets android/app/src/main/res
          npx react-native bundle \
            --platform android \
            --dev true \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Build native Android debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Capture real React Native Android screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -euo pipefail
            PACKAGE="com.aistudio.mbbsqbank.aycxvd.debug"
            APK="$(find mobile/android/app/build/outputs/apk/debug -name '*.apk' | head -1)"
            OUT="artifacts/native-screenshots/v23"
            mkdir -p "$OUT"

            adb install -r "$APK"
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb shell pm clear "$PACKAGE" || true
            adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1 >/dev/null
            sleep 4

            dump_ui() {
              adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
              adb pull /sdcard/window.xml /tmp/window.xml >/dev/null 2>&1 || true
            }

            find_and_tap() {
              local needle="$1"
              dump_ui
              NEEDLE="$needle" python3 - <<'PY'
import os, re, subprocess, sys, xml.etree.ElementTree as ET
needle=os.environ["NEEDLE"].lower()
try:
    root=ET.parse("/tmp/window.xml").getroot()
except Exception:
    sys.exit(2)
matches=[]
for node in root.iter("node"):
    text=(node.attrib.get("text","") + " " + node.attrib.get("content-desc","")).strip()
    if needle in text.lower():
        b=node.attrib.get("bounds","")
        m=re.match(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", b)
        if m:
            x1,y1,x2,y2=map(int,m.groups())
            area=max(1,(x2-x1)*(y2-y1))
            matches.append((area,(x1+x2)//2,(y1+y2)//2,text))
if not matches:
    sys.exit(1)
matches.sort(key=lambda x:x[0])
_,x,y,text=matches[0]
print(f"tap {text!r} at {x},{y}")
subprocess.check_call(["adb","shell","input","tap",str(x),str(y)])
PY
            }

            tap_if_present() {
              find_and_tap "$1" || true
              sleep 1
            }

            scroll_until() {
              local needle="$1"
              local tries="${2:-7}"
              for i in $(seq 1 "$tries"); do
                if find_and_tap "__DO_NOT_TAP_A_REAL_LABEL__" 2>/dev/null; then :; fi
                dump_ui
                if NEEDLE="$needle" python3 - <<'PY'
import os, xml.etree.ElementTree as ET, sys
needle=os.environ["NEEDLE"].lower()
try:
    root=ET.parse("/tmp/window.xml").getroot()
except Exception:
    sys.exit(1)
for n in root.iter("node"):
    hay=(n.attrib.get("text","")+" "+n.attrib.get("content-desc","")).lower()
    if needle in hay:
        sys.exit(0)
sys.exit(1)
PY
                then
                  return 0
                fi
                adb shell input swipe 540 1780 540 620 550
                sleep 1
              done
              return 1
            }

            shot() {
              local name="$1"
              adb exec-out screencap -p > "$OUT/$name.png"
              test -s "$OUT/$name.png"
            }

            # First-run gate. Debug JS sets __DEV__ true, so Google verification is
            # bypassed only for this local screenshot build; production behaviour is untouched.
            tap_if_present "Continue"
            sleep 2
            find_and_tap "Display name"
            adb shell input text "NativePreview"
            adb shell input keyevent 4
            sleep 1
            tap_if_present "Final Year"
            tap_if_present "Start studying"
            sleep 3

            # Dismiss the walkthrough if it starts after onboarding.
            tap_if_present "Skip the walkthrough"
            tap_if_present "Close the walkthrough"
            sleep 2

            shot "01-home-native"

            # Notes is a real bottom-nav tab in the React Native app.
            find_and_tap "Notes"
            sleep 2
            shot "02-notes-native"

            # Case proformas sit below the year cards.
            scroll_until "Clinical case proformas" 6
            find_and_tap "Clinical case proformas"
            sleep 2
            shot "03-case-proforma-list-native"

            # Open the real CVS proforma. General Physical Examination opens
            # preferentially by the merged v23 implementation.
            find_and_tap "Open Cardiovascular System"
            sleep 2
            shot "04-cvs-guide-native"

            # Clerk Patient is the real segmented tab in ClinicalProformaModal.
            find_and_tap "Clerk Patient"
            sleep 2
            shot "05-clerk-patient-top-native"

            # Scroll the actual native ScrollView until GPE is on screen.
            scroll_until "5. General Physical Examination" 9
            sleep 1
            shot "06-general-physical-exam-native"

            # The Normal Values panel is directly below GPE.
            scroll_until "Show normal values" 5
            find_and_tap "Show normal values"
            sleep 1
            shot "07-normal-values-expanded-native"

            # Also capture the real Viva tab.
            adb shell input swipe 540 620 540 1780 450 || true
            sleep 1
            find_and_tap "Viva Q&A" || true
            sleep 2
            shot "08-viva-native"

            ls -lh "$OUT"

      - name: Upload native screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbit-native-android-screenshots-v23
          path: artifacts/native-screenshots/v23/*.png
          if-no-files-found: error

      - name: Commit screenshots to main
        run: |
          if [ -n "$(git status --porcelain artifacts/native-screenshots/v23)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add artifacts/native-screenshots/v23
            git commit -m "chore(screenshots): capture native Android v23 case proforma"
            git push origin HEAD:main
          else
            echo "No screenshot changes to commit."
          fi

name: Native Android screenshots

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-screenshots.yml'
      - 'mobile/scripts/native_screenshot_driver.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: native-android-screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      # Reuse the already-successful native debug build from this exact v23 app
      # state instead of recompiling React Native a second time.
      - name: Download real native debug APK
        uses: actions/download-artifact@v4
        with:
          name: orbit-debug-apk
          path: downloaded-apk
          run-id: 35290022586
          github-token: ${{ github.token }}

      - name: Show APK
        run: find downloaded-apk -type f -maxdepth 3 -ls

      - name: Capture real React Native Android screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -euo pipefail
            APK="$(find downloaded-apk -type f -name '*.apk' | head -1)"
            test -n "$APK"
            adb install -r "$APK"
            ORBIT_PACKAGE="com.aistudio.mbbsqbank.aycxvd.debug" \
            ORBIT_SCREENSHOT_OUT="artifacts/native-screenshots/v23" \
              python3 mobile/scripts/native_screenshot_driver.py

      - name: Upload native screenshot artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbit-native-android-screenshots-v23
          path: artifacts/native-screenshots/v23/*.png
          if-no-files-found: warn

      - name: Commit screenshots to main
        if: success()
        run: |
          if [ -n "$(git status --porcelain artifacts/native-screenshots/v23)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add artifacts/native-screenshots/v23
            git commit -m "chore(screenshots): capture native Android v23 case proforma"
            git push origin HEAD:main
          else
            echo "No screenshot changes to commit."
          fi

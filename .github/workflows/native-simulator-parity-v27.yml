name: V27 Android vs Vercel simulator screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/src/screens/SimulatorScreen.tsx'
      - 'mobile/scripts/simulator_parity_screenshots.py'
      - '.github/workflows/native-simulator-parity-v27.yml'

permissions:
  actions: read
  contents: read

jobs:
  parity-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify source parity contract
        run: node mobile/scripts/simulator-parity-contract-check.mjs

      - name: Wait for debug APK built from identical commit
        id: debug
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 120; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...context.repo, workflow_id: 'android-debug.yml',
                head_sha: context.sha, per_page: 10,
              });
              const run = data.workflow_runs.find(r => r.head_sha === context.sha);
              if (run?.status === 'completed') {
                if (run.conclusion !== 'success') throw new Error('Debug build failed: ' + run.conclusion);
                core.setOutput('run_id', run.id);
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 15000));
            }
            throw new Error('No matching debug APK artifact');

      - uses: actions/download-artifact@v4
        with:
          name: orbit-debug-apk
          path: downloaded-apk
          run-id: ${{ steps.debug.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Capture reference Vercel browser screenshot
        run: |
          npm ci --legacy-peer-deps --ignore-scripts
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0
          npx playwright install --with-deps chromium
          mkdir -p artifacts/native-screenshots/v27
          npx playwright screenshot --browser chromium --viewport-size="393,852" --wait-for-timeout=10000 \
            'https://orbitmbbs.vercel.app/simulator' \
            artifacts/native-screenshots/v27/02-vercel-mobile-reference.png

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Screenshot actual Android app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_7_pro
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r downloaded-apk/app-preview.apk
            ORBIT_SCREENSHOT_OUT=artifacts/native-screenshots/v27 python3 mobile/scripts/simulator_parity_screenshots.py

      - name: Upload reference and native screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-v27-native-vs-vercel-simulator-${{ github.sha }}
          path: artifacts/native-screenshots/v27
          if-no-files-found: warn
          retention-days: 14

name: Native RGUHS MUHS WBUHS question bank emulator

# Installs real APK and checks university-specific native screens.
# QA files are outside mobile/** and do not restart the app build.
on:
  push:
    branches: [main]
    paths:
      - 'qa/native_university_bank_smoke.py'
      - '.github/workflows/native-university-banks.yml'
  workflow_run:
    workflows: ['Android debug APK']
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: native-university-banks-main
  cancel-in-progress: true

jobs:
  installed-question-banks:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30

      - name: Identify successful APK matching main's app source
        id: matching_apk
        uses: actions/github-script@v7
        with:
          script: |
            // Find the last app-affecting source commit. QA-only commits do
            // not change compiled APK bytes; the runner has 30 commits.
            const {execFileSync} = require('child_process');
            const expectedSha = execFileSync('git', [
              'log', '-1', '--format=%H', '--',
              'mobile/', 'src/', 'public/', 'scripts/',
              '.github/workflows/android-debug.yml',
            ], {encoding: 'utf8'}).trim();
            core.info('Checking APK built from exact app source ' + expectedSha);
            for (let attempt = 0; attempt < 180; attempt++) {
              try {
                const {data} = await github.rest.actions.listWorkflowRuns({
                  ...context.repo, workflow_id: 'android-debug.yml',
                  branch: 'main', per_page: 35,
                });
                const run = data.workflow_runs.find(r => r.head_sha === expectedSha);
                if (run?.status === 'completed') {
                  if (run.conclusion !== 'success') {
                    throw new Error('Matching Android debug APK failed: ' + run.conclusion);
                  }
                  core.setOutput('run_id', String(run.id));
                  core.setOutput('apk_sha', run.head_sha);
                  core.setOutput('qa_sha', context.sha);
                  core.info('Matched APK run ' + run.id + ' to ' + expectedSha);
                  return;
                }
              } catch (e) {
                if (String(e.message ?? e).includes('Matching Android debug APK failed')) throw e;
                core.warning('GitHub Actions lookup temporarily unavailable: ' + String(e));
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('No successful Android debug APK matches the latest compiled app source.');

      - name: Download source-matched Android debug APK
        uses: actions/download-artifact@v4
        with:
          name: orbit-debug-apk
          path: downloaded-apk
          run-id: ${{ steps.matching_apk.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Check candidate artifact
        run: |
          test -s downloaded-apk/app-preview.apk
          sha256sum downloaded-apk/app-preview.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android emulator RGUHS MUHS WBUHS screens and search
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-boot-timeout: 360
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -euxo pipefail
            mkdir -p artifacts/university-bank-native
            adb shell wm size 1080x2400
            adb shell wm density 440
            adb install -r downloaded-apk/app-preview.apk
            export ORBIT_PACKAGE=com.aistudio.mbbsqbank.aycxvd.debug
            export ORBIT_SCREENSHOT_OUT=artifacts/university-bank-native
            export ORBIT_APK_PROVENANCE="APK ${{ steps.matching_apk.outputs.apk_sha }}; QA ${{ steps.matching_apk.outputs.qa_sha }}; run ${{ steps.matching_apk.outputs.run_id }}"
            python3 qa/native_university_bank_smoke.py

      - name: Upload real native screenshots and crash evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-native-university-bank-evidence
          path: artifacts/university-bank-native/
          if-no-files-found: warn
          retention-days: 14

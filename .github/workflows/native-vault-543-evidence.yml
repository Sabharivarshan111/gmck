name: Native 543 Mobile Evidence

on:
  push:
    branches: [codex/native-vault-543-evidence-20261015]
    paths:
      - '.github/workflows/native-vault-543-evidence.yml'
      - 'mobile/scripts/**'
  workflow_dispatch:

concurrency:
  group: native-543-evidence-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check the local advanced teaching integration in a mobile browser
        run: |
          npm ci --legacy-peer-deps --ignore-scripts
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0
          npx playwright install --with-deps chromium
          npm ci --prefix mobile --legacy-peer-deps --ignore-scripts
          node mobile/scripts/build-local-simulator.mjs
          node mobile/scripts/native-teaching-browser-check.mjs
      - name: Wait for matching Android debug build
        id: debug
        uses: actions/github-script@v7
        with:
          script: |
            const sourceSha='678fdad7447bfbc76a083fb8213509c4947aea34';
            const {data:comparison}=await github.rest.repos.compareCommits({
              ...context.repo,base:sourceSha,head:context.sha
            });
            const allowed=new Set([
              '.github/workflows/native-vault-543-evidence.yml',
              'mobile/scripts/native_screenshot_driver.py',
              'mobile/scripts/vercel_android_reference_screenshots.py',
              'mobile/scripts/audit_native_vault_screenshots.py',
              'mobile/scripts/native_anatomy_screenshots.py',
              'mobile/scripts/native_clinical_studio_screenshots.py',
              'mobile/scripts/native_diagnostic_controls.py',
              'mobile/scripts/run_native_diagnostic_captures.py',
              'mobile/scripts/ui-dump/UiDump.java',
              '.agents/state/resume-notes.md',
            ]);
            if(comparison.status!=='ahead' || !comparison.files?.length || comparison.files.some(file=>!allowed.has(file.filename))) {
              throw Error('Evidence-only APK reuse rejected: app/runtime source differs or diff is incomplete');
            }
            const fs=require('fs');
            fs.mkdirSync('artifacts/native-vault-parity',{recursive:true});
            fs.writeFileSync('artifacts/native-vault-parity/apk-provenance.json',JSON.stringify({apkSourceSha:sourceSha,captureSourceSha:context.sha,onlyEvidenceFilesChanged:true},null,2));
            for (let attempt=0;attempt<240;attempt++){
              const {data}=await github.rest.actions.listWorkflowRuns({
                ...context.repo,workflow_id:'android-debug.yml',head_sha:sourceSha,per_page:10
              });
              const run=data.workflow_runs.find(r=>r.head_sha===sourceSha && r.conclusion!=='cancelled');
              if(run?.status==='completed'){
                if(run.conclusion!=='success') throw new Error('Debug build failed: '+run.conclusion);
                core.setOutput('run_id',run.id);return;
              }
              await new Promise(resolve=>setTimeout(resolve,15000));
            }
            throw new Error('Timed out waiting for a matching native debug APK');
      - id: apk
        uses: actions/download-artifact@v4
        with:
          name: orbit-debug-apk
          path: downloaded-apk
          run-id: ${{ steps.debug.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Screenshot the actual Vercel clinical studio for reference
        run: |
          mkdir -p artifacts/native-vault-parity
          node mobile/scripts/native-anatomy-parity-manifest.mjs artifacts/native-vault-parity/anatomy-coverage.json
          node mobile/scripts/vercel_mobile_vault_screenshots.mjs artifacts/native-vault-parity

      - name: Enable emulator acceleration
        if: ${{ !cancelled() && steps.apk.outcome == 'success' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the Android emulator image with retries
        if: ${{ !cancelled() && steps.apk.outcome == 'success' }}
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          for attempt in 1 2 3; do
            if sdkmanager --install 'system-images;android-35;google_apis;x86_64' --channel=0; then
              exit 0
            fi
            python3 -c 'import os,pathlib,shutil; root=pathlib.Path(os.environ["ANDROID_HOME"])/".temp"; [(shutil.rmtree(p) if p.is_dir() and not p.is_symlink() else p.unlink()) for p in root.glob("PackageOperation*")]'
            sleep 5
          done
          exit 1

      - name: Screenshot actual installed React Native views on Android
        if: ${{ !cancelled() && steps.apk.outcome == 'success' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb shell wm size 1179x2556
            adb shell wm density 480
            adb install -r downloaded-apk/app-preview.apk
            bash mobile/scripts/build-ui-dump.sh
            adb shell wm size > artifacts/native-vault-parity/android-display-size.txt
            adb shell wm density > artifacts/native-vault-parity/android-display-density.txt
            ORBIT_UI_HELPER=1 ORBIT_SCREENSHOT_OUT=artifacts/native-vault-parity python3 mobile/scripts/run_native_diagnostic_captures.py

      - name: Audit and assemble Vercel versus installed Android screenshots
        if: always()
        run: |
          python3 -m pip install --quiet --break-system-packages pillow
          python3 mobile/scripts/audit_native_vault_screenshots.py artifacts/native-vault-parity

      - name: Upload side-by-side evidence (unapproved WIP, not a release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-543-controls-${{ github.sha }}
          path: artifacts/native-vault-parity/
          if-no-files-found: warn
          retention-days: 14

  anatomy:
    runs-on: ubuntu-latest
    timeout-minutes: 180

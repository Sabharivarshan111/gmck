name: WIP Native vs Vercel Studio Visual Evidence

on:
  push:
    branches: [main, codex/native-vault-full-port-20261014, codex/native-vault-audit-20261015]
    paths:
      - '.github/workflows/android-debug.yml'
      - '.github/workflows/native-vault-visual-evidence.yml'
      - 'mobile/src/components/NativeClinicalStudio.tsx'
      - 'mobile/src/components/NativeEcgTwelveLead.tsx'
      - 'mobile/src/screens/SimulatorScreen.tsx'
      - 'mobile/scripts/native_clinical_studio_screenshots.py'
      - 'mobile/scripts/audit_native_vault_screenshots.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Wait for matching Android debug build
        id: debug
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt=0;attempt<120;attempt++){
              const {data}=await github.rest.actions.listWorkflowRuns({
                ...context.repo,workflow_id:'android-debug.yml',head_sha:context.sha,per_page:10
              });
              const run=data.workflow_runs.find(r=>r.head_sha===context.sha);
              if(run?.status==='completed'){
                if(run.conclusion!=='success') throw new Error('Debug build failed: '+run.conclusion);
                core.setOutput('run_id',run.id);return;
              }
              await new Promise(resolve=>setTimeout(resolve,15000));
            }
            throw new Error('Timed out waiting for a matching native debug APK');
      - uses: actions/download-artifact@v4
        with:
          name: orbit-debug-apk
          path: downloaded-apk
          run-id: ${{ steps.debug.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Screenshot the actual Vercel clinical studio for reference
        run: |
          npm ci --legacy-peer-deps --ignore-scripts
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0
          npx playwright install --with-deps chromium
          mkdir -p artifacts/native-vault-parity
          npx playwright screenshot --browser chromium --viewport-size="393,852" --wait-for-timeout=7500 \
            'https://orbitmbbs.vercel.app/simulator' \
            artifacts/native-vault-parity/00-vercel-studio-393x852.png
          npx playwright screenshot --browser chromium --viewport-size="393,852" --wait-for-timeout=7500 \
            'https://orbitmbbs.vercel.app/simulator?mode=case&scenario=stemi' \
            artifacts/native-vault-parity/00-vercel-case-393x852.png
          npx playwright screenshot --browser chromium --viewport-size="393,852" --wait-for-timeout=7500 \
            'https://orbitmbbs.vercel.app/simulator?mode=telemetry' \
            artifacts/native-vault-parity/00-vercel-icu-393x852.png

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Screenshot actual installed React Native views on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_7_pro
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r downloaded-apk/app-preview.apk
            ORBIT_SCREENSHOT_OUT=artifacts/native-vault-parity python3 mobile/scripts/native_clinical_studio_screenshots.py

      - name: Audit and assemble Vercel versus installed Android screenshots
        if: always()
        run: |
          python3 -m pip install --quiet --break-system-packages pillow
          python3 mobile/scripts/audit_native_vault_screenshots.py artifacts/native-vault-parity

      - name: Upload side-by-side evidence (unapproved WIP, not a release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-vault-port-wip-${{ github.sha }}
          path: artifacts/native-vault-parity/
          if-no-files-found: warn
          retention-days: 14

name: WIP Native vs Vercel Studio Visual Evidence

on:
  push:
    branches: [main, codex/native-vault-full-port-20261014, codex/native-vault-audit-20261015, codex/native-vault-anatomy-cache-20261014]
    paths:
      - '.github/workflows/android-debug.yml'
      - '.github/workflows/native-vault-visual-evidence.yml'
      - 'mobile/**'
      - 'public/clinical-reference/**'
      - 'mobile/src/components/NativeEcgTwelveLead.tsx'
      - 'mobile/src/screens/SimulatorScreen.tsx'
      - 'mobile/scripts/native_clinical_studio_screenshots.py'
      - 'mobile/scripts/audit_native_vault_screenshots.py'
  workflow_dispatch:

concurrency:
  group: native-vault-visual-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Wait for matching Android debug build
        id: debug
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt=0;attempt<120;attempt++){
              const {data}=await github.rest.actions.listWorkflowRuns({
                ...context.repo,workflow_id:'android-debug.yml',head_sha:context.sha,per_page:10
              });
              const run=data.workflow_runs.find(r=>r.head_sha===context.sha && r.conclusion!=='cancelled');
              if(run?.status==='completed'){
                if(run.conclusion!=='success') throw new Error('Debug build failed: '+run.conclusion);
                core.setOutput('run_id',run.id);return;
              }
              await new Promise(resolve=>setTimeout(resolve,15000));
            }
            throw new Error('Timed out waiting for a matching native debug APK');
      - id: apk
        uses: actions/download-artifact@v4
        with:
          name: orbit-debug-apk
          path: downloaded-apk
          run-id: ${{ steps.debug.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Screenshot the actual Vercel clinical studio for reference
        run: |
          npm ci --legacy-peer-deps --ignore-scripts
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0
          npx playwright install --with-deps chromium
          mkdir -p artifacts/native-vault-parity
          node mobile/scripts/native-anatomy-parity-manifest.mjs artifacts/native-vault-parity/anatomy-coverage.json
          node mobile/scripts/vercel_mobile_vault_screenshots.mjs artifacts/native-vault-parity

      - name: Enable emulator acceleration
        if: ${{ !cancelled() && steps.apk.outcome == 'success' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Screenshot actual installed React Native views on Android
        if: ${{ !cancelled() && steps.apk.outcome == 'success' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb shell wm size 1179x2556
            adb shell wm density 480
            adb install -r downloaded-apk/app-preview.apk
            adb shell wm size > artifacts/native-vault-parity/android-display-size.txt
            adb shell wm density > artifacts/native-vault-parity/android-display-density.txt
            ORBIT_SCREENSHOT_OUT=artifacts/native-vault-parity python3 mobile/scripts/run_native_vault_captures.py

      - name: Capture every Vercel organ at the actual Android renderer dimensions
        if: ${{ !cancelled() && steps.apk.outcome == 'success' }}
        run: node mobile/scripts/vercel_anatomy_screenshots.mjs artifacts/native-vault-parity

      - name: Audit and assemble Vercel versus installed Android screenshots
        if: always()
        run: |
          python3 -m pip install --quiet --break-system-packages pillow
          python3 mobile/scripts/audit_native_vault_screenshots.py artifacts/native-vault-parity

      - name: Upload side-by-side evidence (unapproved WIP, not a release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-vault-port-wip-${{ github.sha }}
          path: artifacts/native-vault-parity/
          if-no-files-found: warn
          retention-days: 14

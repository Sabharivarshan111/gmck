name: OBG source verification

on:
  push:
    branches:
      - chatgpt/v23-obg-source-expansion

permissions:
  contents: read

concurrency:
  group: obg-source-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install
        working-directory: mobile
        run: npm ci --legacy-peer-deps
      - name: Typecheck
        working-directory: mobile
        run: npx tsc --noEmit
      - name: Lint
        working-directory: mobile
        run: npx eslint . --quiet
      - name: Proforma checks
        working-directory: mobile
        run: |
          npm run check:proformas
          npm run check:proforma-pdf-extractor
          npm run check:keyboard
          npm run check:edges
          npm run check:version

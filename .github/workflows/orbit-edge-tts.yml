name: ORBIT Edge TTS Voiceover

on:
  pull_request:
    paths:
      - "video-ads/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voiceover:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video-ads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Edge TTS
        run: python -m pip install -r requirements.txt
      - name: Generate ORBIT narration
        env:
          ORBIT_TTS_VOICE: en-IN-PrabhatNeural
          ORBIT_TTS_RATE: "+8%"
        run: python scripts/generate_voiceover.py
      - name: Upload narration
        uses: actions/upload-artifact@v4
        with:
          name: orbit-edge-tts-voiceover
          path: video-ads/public/audio/voiceover.mp3
          if-no-files-found: error

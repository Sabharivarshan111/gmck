name: ORBIT Connected Anatomy
on:
  push:
    branches: [main]
    paths: ['src/simulator/data/organConnections.ts', 'src/simulator/controls/OrganConnections*', 'src/simulator/controls/OrganDetailDrawer.tsx', 'src/simulator/view/AnatomicalBody3D.tsx', 'scripts/organ-connections*', 'scripts/direct-organ-open-e2e.mjs', 'src/pages/Simulator.tsx', 'src/simulator/view/isolationFraming.ts', 'scripts/build-organ-connections.mjs', '.github/workflows/organ-connections.yml']
  pull_request:
    paths: ['src/simulator/data/organConnections.ts', 'src/simulator/controls/OrganConnections*', 'src/simulator/controls/OrganDetailDrawer.tsx', 'src/simulator/view/AnatomicalBody3D.tsx', 'scripts/organ-connections*', 'scripts/direct-organ-open-e2e.mjs', 'src/pages/Simulator.tsx', 'src/simulator/view/isolationFraming.ts', 'scripts/build-organ-connections.mjs', '.github/workflows/organ-connections.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      ORGAN_CONNECTION_GROUP: ${{ matrix.group }}
      ORGAN_CONNECTION_GROUPS: 8
    steps:
      - uses: actions/checkout@v4
      - name: Set browser module path on the runner
        run: echo "ORBIT_PLAYWRIGHT_MODULE=$RUNNER_TEMP/orbit-anatomy-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - run: node --experimental-strip-types scripts/organ-connections-check.mjs
      - run: npm run check:simulator
      - run: npm run check:simulator-mobile
      - run: npm run check:simulator-assets
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npm run build
      - run: npm install --prefix "$RUNNER_TEMP/orbit-anatomy-browser" --ignore-scripts --no-audit --no-fund playwright@1.55.0
      - run: node "$RUNNER_TEMP/orbit-anatomy-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Exercise source-backed views and all dossier controls
        run: |
          npx vite preview --host 127.0.0.1 --port 4180 > /tmp/anatomy-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4180/simulator >/dev/null; then break; fi
            sleep 1
          done
          node --experimental-strip-types scripts/organ-connections-e2e.mjs
          if [ "$ORGAN_CONNECTION_GROUP" = "0" ]; then node scripts/direct-organ-open-e2e.mjs; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: organ-connections-${{ github.sha }}-${{ matrix.group }}
          path: |
            artifacts/organ-connections
            artifacts/direct-organ-open
          retention-days: 14

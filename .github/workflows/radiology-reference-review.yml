name: Radiology reference review
on:
  push:
    branches: [codex/radiology-case-gallery]
    paths: ['scripts/radiology-reference-review.py', '.github/workflows/radiology-reference-review.yml']
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install Pillow
      - run: python scripts/radiology-reference-review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radiology-reference-review
          path: radiology-review
          retention-days: 7

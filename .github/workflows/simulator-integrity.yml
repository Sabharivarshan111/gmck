name: ORBIT Simulator Integrity

on:
  push:
    branches: [main]
    paths:
      - "src/simulator/**"
      - "src/pages/Simulator.tsx"
      - "public/models/**"
      - "scripts/simulator-organ-check.mjs"
      - "scripts/simulator-model-asset-check.mjs"
      - "scripts/all-organ-anatomy-audit.mjs"
      - "scripts/heart-anatomy-audit.mjs"
      - "scripts/all-organ-anatomy-audit.mjs"
      - "scripts/heart-anatomy-audit.mjs"
      - ".github/workflows/simulator-integrity.yml"
  pull_request:
    paths:
      - "src/simulator/**"
      - "src/pages/Simulator.tsx"
      - "public/models/**"
      - "scripts/simulator-organ-check.mjs"
      - "scripts/simulator-model-asset-check.mjs"
      - ".github/workflows/simulator-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Organ resolver regression suite
        run: npm run check:simulator
      - name: Model asset integrity
        run: npm run check:simulator-assets
      - name: Heart anatomy completeness audit
        run: node scripts/heart-anatomy-audit.mjs
      - name: All-organ source coverage audit
        run: node scripts/all-organ-anatomy-audit.mjs
      - name: Production build
        run: npm run build
      - name: Deploy-size guard
        run: npm run check:deploy

name: ORBIT Mobile UX Production Smoke

on:
  push:
    paths:
      - 'src/pages/Simulator.tsx'
      - 'src/simulator/**'
      - 'scripts/simulator-mobile-ux-smoke.mjs'
      - 'scripts/simulator-studio-e2e.mjs'
      - 'scripts/simulator-eye-e2e.mjs'
      - 'scripts/simulator-eye-check.mjs'
      - 'public/models/eye-exam/**'
      - 'public/clinical-reference/**'
      - 'scripts/simulator-clinical-e2e.mjs'
      - 'scripts/vault-layout-e2e.mjs'
      - 'mobile/src/screens/NotesScreen.tsx'
      - '.github/workflows/simulator-mobile-ux-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-mobile-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Install Chromium runner
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            echo "Playwright dependency install hit a transient registry error; retrying..."
            sleep $((attempt * 5))
          done
          npx playwright install --with-deps chromium

      - name: Build and serve this commit's simulator
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          npm run build
          npm run preview -- --host 127.0.0.1 --port 4180 > /tmp/simulator-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4180/simulator > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4180/simulator > /dev/null

      - name: Verify clinical eye response and reference asset integrity
        run: node --experimental-strip-types scripts/simulator-eye-check.mjs

      - name: Exercise real-time 3D eye examination
        env:
          ORBIT_STUDIO_BASE_URL: http://127.0.0.1:4180
        run: node scripts/simulator-eye-e2e.mjs

      - name: Verify ECG lessons and mobile lead reading
        run: node scripts/simulator-ecg-e2e.mjs
      - name: Exercise normal skills and mobile studio widths
        env:
          ORBIT_STUDIO_BASE_URL: http://127.0.0.1:4180
        run: node scripts/simulator-studio-e2e.mjs

      - name: Verify clinical 3D, radiology and all ultrasound controls
        env:
          ORBIT_STUDIO_BASE_URL: http://127.0.0.1:4180
        run: node scripts/simulator-clinical-e2e.mjs

      - name: Exercise the live mobile anatomy UX
        env:
          SIMULATOR_E2E_BASE_URL: http://127.0.0.1:4180
        run: node scripts/simulator-mobile-ux-smoke.mjs

      - name: Upload focused mobile UX screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-mobile-ux-${{ github.sha }}
          path: |
            artifacts/simulator-mobile-ux
            artifacts/simulator-eye-exam
            artifacts/simulator-clinical
            artifacts/simulator-ecg
          if-no-files-found: error
          retention-days: 14

  vault-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - run: npm --prefix mobile ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - run: ./mobile/node_modules/.bin/tsc -p mobile/tsconfig.json --noEmit
      - run: npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Build native browser interface with the simulator
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          npm run build:vercel
          npm run preview -- --host 127.0.0.1 --port 5225 > /tmp/vault-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5225/notes > /dev/null; then break; fi
            sleep 1
          done
          ORBIT_VAULT_BASE_URL=http://127.0.0.1:5225 node scripts/vault-layout-e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vault-layout-${{ github.sha }}
          path: artifacts/vault-layout
          if-no-files-found: warn

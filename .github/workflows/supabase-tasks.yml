name: Supabase tasks

# The maintenance jobs that need Supabase's Management API, run from a runner
# because the development sandboxes cannot reach Supabase at all — the egress
# gateway answers `403` to CONNECT for both api.supabase.com and the project
# host, so no credential helps there.
#
# **Reports first, changes second.** The first step says which secret it found
# without ever printing a value, so "is the token actually in GitHub?" has an
# answer even when everything after it is skipped.
#
# The token is a Supabase personal access token: full management access to the
# account. It lives only in GitHub's secret store — never in this repo, never in
# a log. `set +x` guards the shell, and every curl reads it from the environment
# rather than the command line so it cannot appear in a process listing.

on:
  push:
    branches:
      - claude/native-app-sync
    paths:
      - '.github/workflows/supabase-tasks.yml'
  workflow_dispatch:

concurrency:
  # Never cancel: this one makes changes, and a half-applied change is worse
  # than a slow one.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tasks:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: pmtgeydtqypwrypshhsx
      # Whichever of these the repo has. Named separately so the report below
      # can say which one was found rather than just "a token".
      TOK_A: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TOK_B: ${{ secrets.SUPABASE_TOKEN }}
      TOK_C: ${{ secrets.SUPABASE_PAT }}
    steps:
      - name: Which Supabase secret is set
        run: |
          set +x
          found=""
          [ -n "$TOK_A" ] && { echo "SUPABASE_ACCESS_TOKEN: set"; found=A; } || echo "SUPABASE_ACCESS_TOKEN: not set"
          [ -n "$TOK_B" ] && { echo "SUPABASE_TOKEN: set";        found=${found:-B}; } || echo "SUPABASE_TOKEN: not set"
          [ -n "$TOK_C" ] && { echo "SUPABASE_PAT: set";          found=${found:-C}; } || echo "SUPABASE_PAT: not set"
          if [ -z "$found" ]; then
            echo "::error::No Supabase token secret found. Add one of the three names above under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "FOUND=$found" >> "$GITHUB_ENV"

      - name: Check the token works, and report the textbooks bucket
        run: |
          set +eux
          case "$FOUND" in A) TOKEN="$TOK_A";; B) TOKEN="$TOK_B";; *) TOKEN="$TOK_C";; esac
          export TOKEN
          code=$(curl -s -o /tmp/buckets.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -d '{"query":"select id, public from storage.buckets order by id;"}')
          echo "list buckets: HTTP $code"
          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "::error::The token was rejected ($code). It may have been rotated, or it may lack access to this project."
            exit 1
          fi
          # Any 2xx. The Management API's database/query answers **201**, not
          # 200, and this check accepted only 200 — which is why this workflow
          # has never once succeeded, in either of its runs, while doing the
          # query correctly every time. The bucket it was written to fix was
          # made private by some other route; do not read a green tick here as
          # evidence that a past run applied anything.
          case "$code" in 2*) ;; *) echo "::error::Unexpected response $code"; cat /tmp/buckets.json; exit 1;; esac
          echo "--- buckets before ---"; cat /tmp/buckets.json; echo

      - name: Make the textbooks bucket private
        run: |
          set +eux
          case "$FOUND" in A) TOKEN="$TOK_A";; B) TOKEN="$TOK_B";; *) TOKEN="$TOK_C";; esac
          export TOKEN
          # It holds OCR'd copyrighted textbooks and the notes function's own
          # comments describe it as private. Public means anyone with a URL can
          # download them. The function reads it with the service-role key and
          # is unaffected by the change.
          #
          # Idempotent: running it again on an already-private bucket is a
          # no-op, which is what makes it safe to leave in a workflow.
          code=$(curl -s -o /tmp/after.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -d '{"query":"update storage.buckets set public = false where id = '\''textbooks'\'' and public is true; select id, public from storage.buckets order by id;"}')
          echo "update: HTTP $code"
          case "$code" in 2*) ;; *) echo "::error::Update failed ($code)"; cat /tmp/after.json; exit 1;; esac
          echo "--- buckets after ---"; cat /tmp/after.json; echo
          if grep -q '"id":"textbooks","public":true' /tmp/after.json; then
            echo "::error::textbooks is still public"
            exit 1
          fi
          echo "textbooks is private."

      - name: Delete the empty note-images bucket
        run: |
          set +eux
          case "$FOUND" in A) TOKEN="$TOK_A";; B) TOKEN="$TOK_B";; *) TOKEN="$TOK_C";; esac
          export TOKEN

          # Left over from a synced-notes design that was reversed the same
          # hour: note pictures are AsyncStorage-only and `check:cloud-ids`
          # keeps them that way. The bucket has been empty, private and free of
          # RLS policies ever since, so this is tidying rather than a fix — the
          # app's owner asked for it on 2026-09-01.
          #
          # SQL cannot do it. `storage.protect_delete()` raises 42501 on any
          # direct delete from the storage tables, which is a guard worth
          # respecting rather than disabling: it is what stops a stray DELETE
          # orphaning objects. The Storage API is the supported route, and it
          # refuses a bucket that still has anything in it — so emptiness is
          # checked by the API itself rather than only by us.

          # Refuse to go on if it has gained an object since this was written.
          code=$(curl -s -o /tmp/count.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -d '{"query":"select count(*)::int as files from storage.objects where bucket_id = '\''note-images'\'';"}')
          case "$code" in 2*) ;; *) echo "::error::Could not count objects ($code)"; cat /tmp/count.json; exit 1;; esac
          echo "objects in note-images: $(cat /tmp/count.json)"
          if ! grep -q '"files":0' /tmp/count.json; then
            echo "::error::note-images is not empty — refusing to delete it."
            exit 1
          fi

          # The Storage API needs a project key, not the personal access token.
          # Fetched here and masked immediately, so it cannot reach a log even
          # by accident; it is never written to disk and never echoed.
          code=$(curl -s -o /tmp/keys.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/api-keys")
          case "$code" in 2*) ;; *) echo "::error::Could not read the project keys ($code)"; exit 1;; esac
          SRK=$(python3 -c "import json,sys;print(next((k.get('api_key','') for k in json.load(open('/tmp/keys.json')) if k.get('name')=='service_role'), ''))")
          rm -f /tmp/keys.json
          if [ -z "$SRK" ]; then
            echo "::error::No service_role key came back from the Management API."
            exit 1
          fi
          echo "::add-mask::$SRK"
          export SRK

          code=$(curl -s -o /tmp/del.json -w '%{http_code}' \
            -H "Authorization: Bearer $SRK" -H "apikey: $SRK" \
            -X DELETE "https://$PROJECT_REF.supabase.co/storage/v1/bucket/note-images")
          echo "delete bucket: HTTP $code"
          case "$code" in
            2*|404) ;;
            *) echo "::error::Delete failed ($code)"; cat /tmp/del.json; exit 1;;
          esac

          # The queue entry's own verify step.
          code=$(curl -s -o /tmp/verify.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -d '{"query":"select count(*)::int as still_there from storage.buckets where id = '\''note-images'\'';"}')
          echo "--- verify ---"; cat /tmp/verify.json; echo
          grep -q '"still_there":0' /tmp/verify.json || { echo "::error::note-images is still there"; exit 1; }
          echo "note-images is gone."

name: University bank import checks
on:
  push:
    branches: [main, claude/native-app-sync]
    paths:
      - 'src/data/universityPapers/**'
      - 'src/lib/university.ts'
      - 'mobile/src/components/UniversityChoice.tsx'
      - 'mobile/scripts/*university*'
      - '.github/workflows/university-import.yml'
      - 'scripts/verify-live-university-bank.py'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/src/screens/RguhsImportedBank.tsx'
      - 'mobile/src/screens/BrowseHomeScreen.tsx'
      - 'mobile/src/lib/rguhsUnifiedBank.ts'
      - 'mobile/src/components/QuestionRow.tsx'
      - 'src/data/universityPapers/**'
      - 'src/lib/university.ts'
      - 'mobile/src/components/UniversityChoice.tsx'
      - '.github/workflows/university-import.yml'
      - 'scripts/verify-live-university-bank.py'
jobs:
  reviewed-bank-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts && npm --prefix mobile ci --legacy-peer-deps --ignore-scripts
      - name: Typecheck native Android bank integration
        working-directory: mobile
        run: npm run typecheck
      - name: Verify bank identities and old-bank parity
        working-directory: mobile
        run: node --experimental-strip-types --no-warnings scripts/university-mcq-answer-check.mjs && node --experimental-strip-types --no-warnings scripts/university-mcq-presentation-check.mjs && node scripts/muhs-verification-check.mjs && npm run check:university-import && npm run check:search-index && npm run check:kuhs-parity
      - name: Verify deployed textbook-grounded MCQ answer
        working-directory: mobile
        run: node scripts/university-mcq-live-check.mjs
      - name: Build emitted native web app
        run: npm --prefix mobile run web:build
      - name: Verify actual emitted question payload
        run: python3 scripts/check-university-import-artifact.py 'dist-native/assets/*.js'
      - name: Install test browser
        working-directory: mobile
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Exercise university switching, chapter search and references
        working-directory: mobile
        run: |
          npm exec vite -- preview --config web/vite.config.ts --host 127.0.0.1 --port 4184 > /tmp/university-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4184 > /dev/null; then break; fi
            sleep 1
          done
          node scripts/university-browser-check.mjs
          node scripts/onboarding-browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: university-browser-results
          path: mobile/artifacts/university-import/


  verify-public-production-bank:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify all reviewed identities in both live production domains
        run: python3 scripts/verify-live-university-bank.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: university-production-payload-proof
          path: artifacts/university-publication/

- assertVisible: "Blaze, 7 day streak badge, unlocked"
- assertVisible: "Inferno, 14 day streak badge, unlocked"
- assertVisible: "STREAK BADGES.*3 / 5 unlocked"
- takeScreenshot: "03-earned-rewards"

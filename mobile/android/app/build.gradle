apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   Variants the plugin will NOT bundle JS for, because it assumes they
    //   load it from Metro over USB.
    //
    //   `internal` is listed here for a reason that is not obvious: the
    //   plugin hardcodes `devEnabled = false` for every variant it bundles,
    //   and `__DEV__ = false` is what switches src/lib/ads.ts from Google's
    //   test ad units to the live ones. The internal build is meant to be
    //   installed and used by us, so it must never serve a live ad. Opting
    //   out of the plugin's bundling and doing it by hand with `--dev true`
    //   is the only way to get a release-signed APK that still shows test
    //   ads — see .github/workflows/android-internal.yml.
    //
    // Only `debug`. `internal` and `preview` are deliberately NOT here: they
    // want the plugin's own bundling, which is optimised and minified. Test
    // ads no longer depend on the bundler's dev flag — src/lib/adsMode.ts owns
    // that now — so a build can be fast and still be unable to show a live ad.
    debuggableVariants = ["debug"]

    /**
     * Find the node executable in common locations for macOS/Linux.
     */
    def findNode = {
        def commonPaths = ["/usr/local/bin/node", "/opt/homebrew/bin/node", "/usr/bin/node", "/bin/node"]
        for (path in commonPaths) {
            if (new java.io.File(path).exists()) return path
        }
        return "node"
    }

    /* Bundling */
    nodeExecutableAndArgs = [findNode()]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    // Must stay exactly the ID of the published listing — Play treats a
    // different applicationId as a different app, so changing it would ship a
    // second listing instead of an update.
    namespace "com.aistudio.mbbsqbank.aycxvd"
    defaultConfig {
        applicationId "com.aistudio.mbbsqbank.aycxvd"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // 13 / "0.0.0.13" is live on Play. Play rejects an upload whose
        // versionCode is not higher than the last one, so bump these for every
        // subsequent upload — INCLUDING a re-upload after a rejection, which
        // is what 15 is.
        //
        // 14 was rejected: "your app could crash on 16 KB devices", naming
        // libzstd-jni-1.5.6-9.so. That is fixed (zstd-jni is 1.5.7-16 below,
        // whose x86_64 library is 16 KB aligned where 1.5.6-9's was 4 KB), but
        // the fix cannot reach Play under the version that was refused.
        versionCode 15
        versionName "0.0.0.15"

        // Deep-link / OAuth callback scheme, consumed by the intent-filter in
        // AndroidManifest.xml. Added with an indexed put rather than assigning
        // the whole map: the React Native Gradle plugin writes
        // `usesCleartextTraffic` into the same placeholders, and replacing the
        // map could drop it and break manifest merging.
        manifestPlaceholders["appAuthRedirectScheme"] = "com.aistudio.mbbsqbank.aycxvd"
    }
    signingConfigs {
        debug {
            // The standard Android debug key by default. Its SHA-1 is the
            // same on every machine on earth and is not a secret — which is
            // exactly why registering it against an OAuth client is a
            // trade-off rather than a free win: anyone can build an app with
            // this key. Acceptable for a `.debug` package that owns nothing.
            //
            // Set DEBUG_KEYSTORE_PATH to sign test builds with a real key
            // instead — the upload key, so a test build carries the same
            // certificate Google Sign-In is already registered against. The
            // passwords come from the environment and never enter the repo.
            def debugKeystore = System.getenv("DEBUG_KEYSTORE_PATH")
            if (debugKeystore) {
                storeFile file(debugKeystore)
                storePassword System.getenv("DEBUG_STORE_PASSWORD")
                keyAlias System.getenv("DEBUG_KEY_ALIAS") ?: "upload"
                keyPassword System.getenv("DEBUG_KEY_PASSWORD")
            } else {
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
        // The existing upload key. Passwords come from the environment so they
        // never land in version control:
        //   KEYSTORE_PATH   absolute path to upload-keystore.jks
        //   STORE_PASSWORD  keystore password
        //   KEY_PASSWORD    key password
        // See mobile/README.md → "Signing a release build".
        release {
            def keystorePath = System.getenv("KEYSTORE_PATH")
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("STORE_PASSWORD")
                keyAlias "upload"
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            // Installs alongside the Play Store build instead of colliding with
            // it. Same package + a different signing key is a refused install,
            // and the only way out of that is uninstalling the published app —
            // which is not something a test build should ever ask for.
            //
            // This does NOT touch the release applicationId, which must stay
            // com.aistudio.mbbsqbank.aycxvd to remain an update of the existing
            // listing.
            //
            // Two consequences, both intended:
            //   • Google Sign-In will not work in a debug build unless an OAuth
            //     client exists for ...aycxvd.debug with the debug key's SHA-1.
            //     Everything else — the question bank, progress, timer, notes —
            //     works normally.
            //   • Ads are Google's test units in debug regardless (src/lib/ads.ts),
            //     so a debug install can never serve a live ad to you.
            applicationIdSuffix ".debug"
            // Keep the OAuth redirect scheme matched to this build's id, so two
            // installed builds do not both claim the same scheme.
            manifestPlaceholders["appAuthRedirectScheme"] = "com.aistudio.mbbsqbank.aycxvd.debug"
            signingConfig signingConfigs.debug
        }
        // The build that is real in every way Google checks.
        //
        // It exists because Google Sign-In matches an app on **package name
        // and signing certificate**, and the debug build deliberately fails
        // both: it carries a `.debug` suffix so it can install beside the
        // Play Store copy, and it is signed with a throwaway key. No amount
        // of configuration makes sign-in work in that build.
        //
        // So this one keeps the real applicationId and the real upload key —
        // and pays the price that comes with them: it has the same package
        // name as the Play Store app but a different signature, so Android
        // refuses to install it over the published copy. That one has to be
        // uninstalled first. That is a real cost, and it is the reason this
        // is a separate variant rather than a change to the debug build.
        //
        // What it does NOT take from a release build is live ads. The JS is
        // bundled by hand with `--dev true` (see debuggableVariants above),
        // so `__DEV__` stays true and the test ad units are used. An APK we
        // install ourselves must never be able to serve us a live ad.
        internal {
            // The React Native Gradle plugin fills in `usesCleartextTraffic`
            // for the build types it knows about — debug and release — and a
            // custom build type gets nothing, so the manifest merger fails
            // with "requires a placeholder substitution but no value is
            // provided". That is the same map CLAUDE.md rule 4 is about: it
            // has to be an indexed put, because assigning the whole map would
            // drop the redirect scheme set beside it.
            //
            // false, not true: this is a release-grade build and has no
            // business allowing cleartext HTTP.
            manifestPlaceholders["usesCleartextTraffic"] = false
            signingConfig signingConfigs.release
            // Off deliberately: this build exists to test behaviour, and a
            // ProGuard rule that is subtly wrong turns a real bug into an
            // unreproducible one. The release build is where minification is
            // exercised.
            minifyEnabled false
            debuggable false
            matchingFallbacks = ["release"]
        }
        // The test build to reach for by default.
        //
        // Release-grade in every way that costs speed — optimised native code,
        // no development support, minified and optimised JavaScript — while
        // still signed with the debug key and carrying the `.debug` suffix, so
        // it needs no secrets and installs beside the Play Store copy.
        //
        // It exists because the plain debug APK is a bad way to judge this
        // app. A debug build runs unoptimised native code with development
        // support switched on, and the lag that gets reported from it is
        // mostly that rather than anything in the app.
        //
        // Ads are Google's test units, chosen in source rather than inherited
        // from the bundler's dev flag. See src/lib/adsMode.ts.
        preview {
            // The React Native Gradle plugin fills in `usesCleartextTraffic`
            // for the build types it knows about — debug and release — and a
            // custom build type gets nothing, so the manifest merger fails
            // with "requires a placeholder substitution but no value is
            // provided". That is the same map CLAUDE.md rule 4 is about: it
            // has to be an indexed put, because assigning the whole map would
            // drop the redirect scheme set beside it.
            //
            // false, not true: this is a release-grade build and has no
            // business allowing cleartext HTTP.
            manifestPlaceholders["usesCleartextTraffic"] = false
            applicationIdSuffix ".debug"
            manifestPlaceholders["appAuthRedirectScheme"] = "com.aistudio.mbbsqbank.aycxvd.debug"
            signingConfig signingConfigs.debug
            debuggable false
            // Off for the same reason as `internal`: this build is for judging
            // behaviour and speed, and a wrong ProGuard rule turns a real bug
            // into an unreproducible one.
            minifyEnabled false
            matchingFallbacks = ["release"]
        }
        release {
            // Falls back to the debug key so `assembleRelease` still works
            // before the keystore is configured — that build is NOT
            // publishable and Play will reject it.
            signingConfig System.getenv("KEYSTORE_PATH")
                ? signingConfigs.release
                : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    /*
     * Zstandard, for reading Anki packages.
     *
     * This is the only part of the .apkg format Android does not already
     * have. A package is a ZIP (java.util.zip) holding a SQLite collection
     * (android.database.sqlite) — both free — but since Anki 2.1.50 the
     * collection, the media list and every media file inside it are
     * zstd-compressed, and everything modern Anki exports is that format
     * unless the person exporting ticked "support older Anki versions". A
     * shared deck downloaded from AnkiWeb cannot be read without this.
     *
     * It is a native library, and it is the one dependency in the importer
     * that costs bytes: the AAR carries a .so per ABI, so the universal APK
     * grows by roughly two megabytes and the *Play download*, which is split
     * per ABI, by about half of one. That is the whole price of the feature,
     * and there is no way around it — the alternative is a pure-Kotlin zstd
     * decoder, which is well over a thousand lines whose bugs would present
     * as a corrupt deck.
     *
     * Everything else about reading a package is in TypeScript
     * (src/lib/apkgFormat.ts) where `npm run check:apkg` can run it against
     * real files. See ApkgModule.kt.
     *
     * ## The version is pinned for 16 KB page support, and NDK cannot fix it
     *
     * Play rejected version 14 with "Your app could crash on 16 KB devices",
     * naming `libzstd-jni-1.5.6-9.so` for arm64-v8a and x86_64. Android 15
     * allows a 16 KB memory page size, and a shared library whose LOAD
     * segments are aligned to less than that cannot be mapped -- the app dies
     * at the `System.loadLibrary` call, which here is the first time anyone
     * opens an Anki package.
     *
     * Google's own advice on that screen is "upgrade to NDK r28 or higher",
     * and following it here would have done nothing. `ndkVersion` governs code
     * THIS project compiles; zstd-jni ships as an AAR with the `.so` files
     * already built, so its alignment was decided by whoever built 1.5.6-9 and
     * no setting on our side can change it. The fix is a newer artifact.
     *
     * Measured from the published AARs rather than assumed -- maximum PT_LOAD
     * alignment, read out of the ELF program headers:
     *
     *            1.5.6-9    1.5.7-16
     *   arm64-v8a  65536      16384     both fine
     *   x86_64      4096      16384     4096 is the failure
     *
     * (armeabi-v7a and x86 are 32-bit; the 16 KB rule does not apply to them.)
     *
     * So x86_64 was the real breakage. Re-run that measurement before changing
     * this version again -- the number is not in the release notes and a
     * version that looks newer is not evidence.
     */
    implementation("com.github.luben:zstd-jni:1.5.7-16@aar")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

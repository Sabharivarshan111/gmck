pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }

def findNode() {
    def commonPaths = ["/usr/local/bin/node", "/opt/homebrew/bin/node", "/usr/bin/node", "/bin/node"]
    for (path in commonPaths) {
        if (new File(path).exists()) return path
    }
    return "node"
}

def nodeCmd = findNode()
def cliPath = "node_modules/@react-native-community/cli/build/bin.js"

extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> 
    ex.autolinkLibrariesFromCommand([nodeCmd, cliPath, "config"]) 
}

rootProject.name = 'OrbitMBBS'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ORBIT MBBS — screen preview</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0b0a14;
      }
      /* react-native-web renders a flex:1 child, which needs a flex parent
         with a real height or the whole tree collapses to zero. */
      #root {
        display: flex;
        flex-direction: column;
        height: 100dvh;
      }
      * {
        box-sizing: border-box;
      }
      @keyframes shimmer {
        to {
          background-position: 300% 0;
        }
      }
      .gradient-shimmer-text {
        background: linear-gradient(
          100deg,
          #ff2e97,
          #ff8a00,
          #ffe600,
          #00ffd5,
          #5d6bff,
          #ff2e97
        );
        background-size: 300% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent !important;
        -webkit-text-fill-color: transparent !important;
        animation: shimmer 6s linear infinite;
        filter: drop-shadow(0 0 18px rgba(255, 80, 200, 0.25));
        will-change: background-position;
      }
      @media (prefers-reduced-motion: reduce) {
        .gradient-shimmer-text {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>

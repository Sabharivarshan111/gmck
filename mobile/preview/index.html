<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ORBIT MBBS — screen preview</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0b0a14;
      }
      /* react-native-web renders a flex:1 child, which needs a flex parent
         with a real height or the whole tree collapses to zero. */
      #root {
        display: flex;
        flex-direction: column;
        height: 100dvh;
      }
      * {
        box-sizing: border-box;
      }
      @keyframes tte03-wipe {
        0%   { background-position: 130% 0; }
        18%  { background-position: 118% 0; }
        100% { background-position: -30% 0; }
      }
      @keyframes tte03-bloom {
        0%, 30%, 100% { opacity: 0; }
        55% { opacity: 0.55; }
        80% { opacity: 0; }
      }
      .gradient-wipe-text {
        background: linear-gradient(
          110deg,
          #2c2f3d 0%,
          #4a4e60 22%,
          #2c2f3d 44%,
          #f5d76e 49%,
          #fff6d6 50%,
          #f5d76e 51%,
          #2c2f3d 56%,
          #4a4e60 78%,
          #2c2f3d 100%
        );
        background-size: 280% 100%;
        background-position: 130% 0;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent !important;
        -webkit-text-fill-color: transparent !important;
        animation: tte03-wipe 3.6s cubic-bezier(0.5, 0, 0.18, 1) infinite;
        will-change: background-position;
      }
      .gradient-wipe-bloom {
        animation: tte03-bloom 3.6s cubic-bezier(0.5, 0, 0.18, 1) infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .gradient-wipe-text {
          background-position: 50% 0;
          animation: none;
        }
        .gradient-wipe-bloom {
          animation: none;
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>

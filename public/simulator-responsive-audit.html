<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patient simulator responsive audit</title><style>body{margin:0;background:#111827;color:#e2e8f0;font:14px system-ui}header{display:flex;align-items:center;gap:12px;padding:12px}button{min-height:44px;background:#243244;border:1px solid #46566d;border-radius:10px;color:white;padding:0 16px}button[aria-pressed=true]{background:#0369a1}iframe{display:block;border:0;margin:0 auto;background:white;width:390px;height:844px;max-width:100%}p{margin:0}label{margin-left:auto}</style><header><p>Responsive browser audit • real simulator</p><button data-width="360">360 × 800</button><button data-width="390" aria-pressed="true">390 × 844</button><button data-width="430">430 × 932</button><button data-width="844">Landscape</button></header><iframe title="Phone simulator" src="/simulator"></iframe><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{const w=+b.dataset.width,f=document.querySelector('iframe');f.style.width=w+'px';f.style.height=({360:800,390:844,430:932,844:390})[w]+'px';document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))});</script></html>
